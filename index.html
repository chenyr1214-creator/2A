const equipment=[['dumbbell',T('哑铃','덤벨','Dumbbells'),T('自由重量，可完成推、拉及下肢训练。选择可控制的重量，握稳并留出活动空间。','프리 웨이트로 밀기·당기기·하체 운동에 사용합니다. 조절 가능한 무게를 고르고 주변 공간을 확보하세요.','Free weights for pressing, pulling and lower-body work. Use a controllable load, a secure grip and clear space.')],['cable',T('绳索训练器','케이블 머신','Cable station'),T('通过滑轮提供阻力。先调好滑轮高度与插销，检查把手连接，再进行推拉训练。','도르래로 저항을 제공합니다. 높이와 중량 핀, 손잡이 연결을 확인한 뒤 시작하세요.','Pulley resistance for pushing and pulling. Set pulley height and weight pin; check handle attachments before use.')],['press',T('坐姿推胸机','체스트 프레스 머신','Chest press machine'),T('用于坐姿推胸。调节座椅，使把手约在胸部高度，背部贴靠垫。','앉아서 가슴 밀기 운동을 합니다. 손잡이가 가슴 높이에 오도록 좌석을 조절하고 등을 패드에 대세요.','For seated chest presses. Adjust the seat so handles sit near chest height and support your back on the pad.')],['pulldown',T('高位下拉机','랫 풀다운 머신','Lat pulldown machine'),T('用于下拉训练。调好大腿固定垫，握住横杆，坐稳后向胸前下拉。','허벅지 패드를 조절하고 바를 잡은 뒤 안정적으로 앉아 가슴 앞으로 당깁니다.','For pulldowns. Adjust the thigh pad, grip the bar and sit securely before pulling toward the upper chest.')],['mat',T('训练垫','운동 매트','Exercise mat'),T('为地面核心训练提供接触面。铺在平整防滑地面，保留周围空间。','바닥 코어 운동에 사용합니다. 평평하고 미끄럽지 않은 바닥에 펴고 공간을 확보하세요.','A surface for floor-based core work. Lay it on a flat, non-slip floor with room around you.')],['legpress',T('腿举机','레그 프레스 머신','Leg press machine'),T('用于下肢推蹬。按机器说明调座椅与安全装置，双脚放稳踏板，保持背部支撑。','하체로 플랫폼을 밉니다. 기구 안내에 따라 좌석과 안전장치를 조절하고 발과 등을 안정시키세요.','For lower-body presses. Follow the machine instructions for seat and safety settings; keep feet secure and back supported.')]];

['chestpress',T('坐姿推胸','시티드 체스트 프레스','Seated chest press'),['press'],['chest'],['shoulder','triceps'],T('背靠垫，脚踩地，把手在胸部高度。','등을 패드에 대고 발을 바닥에 두세요. 손잡이는 가슴 높이입니다.','Support your back, plant your feet and start with handles near chest height.'),T('平稳向前推，再控制返回；不要耸肩或猛锁肘。','앞으로 밀고 천천히 돌아오세요. 어깨를 으쓱하거나 팔꿈치를 세게 잠그지 마세요.','Press forward smoothly and return with control; avoid shrugging or forcefully locking elbows.'),'press'],

['plank',T('前臂平板支撑','포어암 플랭크','Forearm plank'),['mat'],['core'],['shoulder','glutes'],T('前臂撑地，肘在肩下，双腿伸直。','팔꿈치를 어깨 아래에 두고 팔뚝으로 지지하며 다리를 폅니다.','Place elbows under shoulders, forearms down and legs extended.'),T('保持身体成一直线并自然呼吸；不塌腰，失去控制时结束。','몸을 일직선으로 유지하고 자연스럽게 호흡합니다. 허리를 처뜨리지 말고 자세가 무너지면 종료하세요.','Hold a straight body line and breathe naturally; avoid sagging and stop when control is lost.'),'plank'],

const sports=[
['climb','🧗',T('攀岩','클라이밍','Climbing'),['back','biceps','core','glutes'],T('通过手脚配合完成岩壁路线；在攀岩馆参加入门指导。','손발을 조합해 벽의 루트를 오릅니다. 실내 암장에서 입문 지도를 받으세요.','Coordinate hands and feet along a wall route; start with an introductory session at a climbing gym.'),T('攀岩鞋；按项目使用安全带及保护装备。','암벽화; 종목에 맞는 하네스와 확보 장비.','Climbing shoes; harness and belay equipment as required.'),T('学习保护与落地规则，检查装备，不进入他人坠落区域。','확보와 착지 규칙을 배우고 장비를 확인하며 타인의 추락 구역을 피하세요.','Learn belay and landing rules, check equipment and stay out of others’ fall zones.')],
['hike','⛰',T('登山','등산','Hiking'),['quads','glutes','hamstrings','calves'],T('在山地步行；从路线清晰、难度较低的步道开始。','산길을 걷습니다. 길이 명확하고 쉬운 코스부터 시작하세요.','Walk on mountain trails; begin on a clearly marked, easier route.'),T('防滑鞋、饮水、适合天气的衣物及路线地图。','접지력 있는 신발, 물, 날씨에 맞는 옷과 지도.','Grippy shoes, water, weather-appropriate clothing and a route map.'),T('查看天气与路线，告知行程，避免超出能力的路线。','날씨와 경로를 확인하고 일정을 알리며 무리한 코스를 피하세요.','Check weather and route, share your plan and stay within your ability.')],

['dumbbell',2,'哑铃|덤벨|Dumbbells','可用于弯举、推举、划船和深蹲等训练。|컬·프레스·로우·스쿼트 등.|Used for curls, presses, rows and squats.'],['barbell',2,'杠铃|바벨|Barbell','可用于深蹲、卧推、硬拉和划船。|스쿼트·벤치 프레스·데드리프트·로우.|Used for squats, bench presses, deadlifts and rows.'],['rack',2,'深蹲架|스쿼트 랙|Squat rack','辅助杠铃训练；不是独立阻力来源。|바벨 운동 보조; 자체 저항이 아닙니다.|Supports barbell training; does not supply resistance itself.'],['power',2,'力量架|파워 랙|Power rack','通过支架与保护杆辅助杠铃训练。|걸이와 안전바로 바벨 운동 보조.|Supports barbell work with hooks and safety bars.'],['smith',2,'史密斯机|스미스 머신|Smith machine','沿导轨进行推举及下肢抗阻训练。|고정 레일을 따라 프레스와 하체 저항 운동.|Guided-bar pressing and lower-body resistance work.'],['cable',2,'龙门架|케이블 크로스오버|Cable crossover station','调节滑轮和配件，可完成不同方向的抗阻训练。|도르래와 부속 조절로 다양한 방향의 저항 운동.|Adjustable pulleys and attachments allow varied resistance directions.'],['bench',2,'可调节训练凳|조절식 벤치|Adjustable bench','调节靠背角度，配合自由重量完成不同动作。|등받이 각도를 조절해 프리 웨이트 운동 보조.|Adjustable backrest supports varied free-weight exercises.'],
['kettlebell',3,'壶铃|케틀벨|Kettlebell'],['medicine',3,'药球|메디신 볼|Medicine ball','用于持球抗阻或适合该球型的抛接练习。|볼 저항 또는 해당 제품에 맞는 던지기·받기.|For loaded ball work or throws/catches appropriate to the product.','双手握稳，以轻球在指导下练习。|가벼운 볼을 두 손으로 잡고 지도하에 연습.|Use a light ball and secure two-hand grip with guidance.','不是所有药球都适合砸地；遵守产品说明。|모든 볼이 슬램용은 아닙니다. 제품 안내를 따르세요.|Not every medicine ball is slam-rated; follow product instructions.'],['ropes',3,'战绳|배틀 로프|Battle ropes'],['trx',3,'TRX悬挂带|TRX 서스펜션|TRX suspension straps'],['box',3,'跳箱|플라이오 박스|Plyometric box'],['roller',3,'泡沫轴|폼롤러|Foam roller','用于自我滚压与活动准备，不是特定肌肉的力量训练。|자가 롤링과 준비 운동용, 특정 근육 근력 운동이 아닙니다.|For self-rolling and movement preparation, not isolated strength training.','在肌肉软组织上以可耐受压力缓慢滚动。|근육 연부조직에 견딜 수 있는 압력으로 천천히 롤링.|Roll slowly over muscle soft tissue with tolerable pressure.','不直接压关节、骨性突起或受伤部位；疼痛即停。|관절·뼈 돌출부·손상 부위를 직접 누르지 말고 아프면 중단.|Avoid joints, bony prominences and injured areas; stop if painful.'],['ball',3,'筋膜球|마사지 볼|Massage ball','用于局部自我滚压，不作为肌肉力量刺激的替代。|국소 자가 마사지용, 근력 자극을 대체하지 않습니다.|For localized self-massage, not a substitute for strength work.','靠墙控制球与软组织接触压力。|벽을 이용해 볼과 연부조직의 압력 조절.|Use a wall to control pressure against soft tissue.','避开关节、颈前与受伤区域，不忍痛加压。|관절·목 앞·손상 부위를 피하고 통증을 참지 마세요.|Avoid joints, front of neck and injuries; do not force painful pressure.'],['mat',3,'瑜伽垫|요가 매트|Yoga mat','为地面练习提供接触面。|바닥 운동을 위한 표면.|Provides a surface for floor exercises.','铺于平整防滑地面，保留周边空间。|평평하고 미끄럽지 않은 곳에 펴고 공간 확보.|Lay flat on non-slip ground with surrounding space.','地垫不能防止所有跌落伤害，保持干燥清洁。|모든 낙상 부상을 막지는 못합니다. 건조하고 청결하게 유지.|A mat cannot prevent all fall injuries; keep it dry and clean.'],['wheel',3,'健腹轮|앱 휠|Ab wheel'],['band',3,'弹力带|저항 밴드|Resistance band','通过弹性提供抗阻，可配合多方向推拉。|탄성으로 다양한 방향의 밀기·당기기에 저항 제공.|Elastic resistance for varied pushing and pulling.','检查裂口，按产品要求固定，缓慢拉伸回收。|균열을 확인하고 제품 안내에 따라 고정해 천천히 늘리고 복귀.|Inspect for tears, anchor as instructed and stretch/return slowly.','不超出产品拉伸范围，避开回弹路径。|제품 신장 한도를 넘기지 말고 튕김 경로를 피하세요.|Stay within stretch limits and clear of recoil paths.']];

['machineraise','器械侧平举|머신 레터럴 레이즈|Machine lateral raise','lateral','shoulder','upperback','调座椅，按机型让上臂接触垫或握把。|좌석을 조절하고 기종에 따라 위팔 패드나 손잡이 사용.|Adjust seat; use upper-arm pads or handles as designed.','向外抬上臂，再控制还原。|위팔을 옆으로 들고 천천히 복귀.|Raise upper arms outward and return with control.','不要耸肩，先确认关节与机器轴线设置。|어깨를 으쓱하지 말고 기구 축 정렬을 먼저 확인.|Avoid shrugging; check machine alignment first.'],
['facepull','绳索面拉|케이블 페이스 풀|Cable face pull','cable,band','upperback,shoulder','biceps,forearms,core','将绳索设在面部附近高度，站稳握绳。|로프를 얼굴 부근 높이에 설정하고 안정적으로 잡습니다.|Set rope near face height and establish a steady stance.','将绳拉向面部两侧，肘向外展开，再还原。|로프를 얼굴 양옆으로 당겨 팔꿈치를 벌리고 복귀.|Pull rope toward either side of face, elbows opening out, then return.','不要用颈部前伸迎接把手，弹力带需安全固定。|목을 앞으로 내밀지 말고 밴드는 안전하게 고정하세요.|Avoid jutting neck forward; securely anchor bands.'],
['curl','哑铃弯举|덤벨 컬|Dumbbell curl','dumbbell','biceps','forearms','站稳，上臂在体侧，掌心向前持哑铃。|위팔을 옆에 두고 손바닥이 앞을 향하게 덤벨을 잡습니다.|Stand with upper arms by sides, palms facing forward.','屈肘提起，再缓慢放下。|팔꿈치를 굽혀 들고 천천히 내립니다.|Flex elbows to raise, then lower slowly.','不摆动身体，不弯折手腕代偿。|몸을 흔들거나 손목으로 보상하지 마세요.|Avoid swinging and compensatory wrist bending.'],
['preachercurl','牧师凳弯举|프리처 컬|Preacher curl','preacher,dumbbell,barbell,curlmachine','biceps','forearms','上臂贴靠垫，按器械或自由重量选择握持。|위팔을 패드에 대고 기구나 프리 웨이트를 잡습니다.|Rest upper arms on pad; grip the machine or chosen free weight.','屈肘举起，再缓慢伸肘回位。|팔꿈치를 굽혀 들고 천천히 펴 복귀.|Curl upward, then extend elbows slowly to return.','不猛锁肘，不让肩部离垫借力。|팔꿈치를 세게 잠그거나 어깨를 패드에서 떼지 마세요.|Avoid snapping elbows straight or lifting shoulders off support.'],
['extension','绳索三头肌下压|케이블 트라이셉스 푸시다운|Cable triceps pushdown','cable,tricepsmachine','triceps','forearms','肘靠近体侧，握住高位滑轮把手；固定机型先调座位。|팔꿈치를 몸 옆에 두고 높은 도르래 손잡이를 잡습니다. 고정형은 좌석 조절.|Keep elbows near sides, grip high-pulley handle; adjust seat on fixed machines.','伸肘下压，再控制屈肘返回。|팔꿈치를 펴 누르고 천천히 굽혀 복귀.|Extend elbows down, then flex back with control.','固定器械与绳索机路径不同，按机器说明，不晃动上臂。|고정형과 케이블 경로가 다르므로 기구 안내를 따르고 위팔을 고정.|Fixed-machine paths vary; follow instructions and keep upper arms steady.'],
['overheadtri','哑铃过顶臂屈伸|덤벨 오버헤드 익스텐션|Dumbbell overhead triceps extension','dumbbell,bench','triceps','core,forearms','坐稳，双手稳握哑铃于头顶，肘朝上。|안정적으로 앉아 덤벨을 머리 위로 잡고 팔꿈치를 위로.|Sit securely, hold dumbbell overhead with elbows pointing upward.','屈肘将重量降至头后，再伸肘举起。|팔꿈치를 굽혀 머리 뒤로 내리고 다시 폅니다.|Bend elbows to lower behind the head, then extend.','使用轻且可控的重量，避免腰部过度反弓。|가볍고 조절 가능한 중량을 쓰고 허리 과신전 피하기.|Use a manageable light load and avoid back hyperextension.'],
['leg','腿举|레그 프레스|Leg press','legpress','quads,glutes','hamstrings,adductors','背部骨盆贴垫，双脚稳放踏板，先确认安全装置。|등·골반을 패드에 대고 발을 안정시키며 안전장치 확인.|Support back and pelvis, plant feet and check safety mechanisms.','推开踏板，再控制屈髋屈膝回位。|플랫폼을 밀고 고관절·무릎을 굽혀 천천히 복귀.|Press platform away and return through controlled hip/knee flexion.','不锁膝，不让骨盆卷离靠垫。|무릎을 잠그거나 골반을 패드에서 말아 올리지 마세요.|Avoid locking knees or rolling pelvis off the pad.'],
['legextension','腿屈伸|레그 익스텐션|Leg extension','legext','quads','','膝与机器转轴对齐，滚垫在小腿前下方。|무릎을 기구 축에 맞추고 롤러를 정강이 아래 앞쪽에 둡니다.|Align knees with machine axis; pad rests on lower front shins.','伸膝抬起滚垫，再控制屈膝。|무릎을 펴 롤러를 올리고 천천히 굽힙니다.|Extend knees to raise pad, then bend with control.','避免弹踢和用惯性甩起。|발차기 반동을 피하세요.|Avoid kicking or swinging the weight.'],
['legcurl','腿弯举|레그 컬|Leg curl','pronecurl,seatedcurl','hamstrings','calves','俯卧型髋贴垫；坐姿型固定大腿，膝对齐转轴，滚垫在踝后上方。|누운형은 골반을 대고 앉은형은 허벅지 고정, 무릎 축 정렬, 롤러는 발목 뒤 위쪽.|Prone: hips on pad. Seated: thighs secured. Align knees with axis; pad above back of ankles.','屈膝拉动滚垫，再缓慢回位。|무릎을 굽혀 롤러를 당기고 천천히 복귀.|Flex knees to move pad, then return slowly.','不抬髋或猛拱腰，按机型调整。|골반을 들거나 허리를 꺾지 말고 기종에 맞게 조절.|Avoid lifting hips or arching; adjust to the specific model.'],
['hacksquat','哈克深蹲|핵 스쿼트|Hack squat','hack','quads,glutes','adductors,core','肩背贴垫，双脚踏稳，学习解锁与复位。|어깨·등을 패드에 대고 발을 고정, 해제·잠금법 확인.|Support shoulders/back, plant feet and learn release/locking controls.','屈膝屈髋下蹲，再推回站姿。|고관절·무릎을 굽혀 앉고 다시 밀어 섭니다.|Bend hips/knees to descend, then push up.','先设安全挡，膝随脚尖，不锁膝。|안전 스톱을 설정하고 무릎은 발끝 방향, 잠금 피하기.|Set stops; track knees with toes and avoid locking.'],
['smithsquat','史密斯机深蹲|스미스 스쿼트|Smith machine squat','smith','quads,glutes','adductors,core','杠置上背肌肉处，站位适应导轨，先设安全挡。|바를 목이 아닌 상부 등 근육에 두고 레일에 맞게 서며 안전 스톱 설정.|Place bar on upper-back muscle, set stance for rails and safety stops.','控制下蹲，再站起并安全挂杠。|천천히 앉고 일어나 안전하게 바를 겁니다.|Squat with control, rise and safely re-rack.','不将杠压颈部；先请指导确认站位。|목에 바를 누르지 말고 먼저 지도로 발 위치 확인.|Avoid bar pressure on neck; get stance guidance first.'],
['hipthrust','臀推|힙 스러스트|Hip thrust','barbell,bench,smith','glutes','hamstrings,core','上背靠稳固凳边，脚踩地，带护垫的杠放髋部。|상부 등을 안정된 벤치에 대고 발을 바닥에 두며 패딩한 바를 골반에 둡니다.|Support upper back on stable bench, feet planted, padded bar across hips.','伸髋抬起至躯干与大腿大致成线，再降低。|몸통과 허벅지가 대략 일직선이 되도록 고관절을 펴고 내립니다.|Extend hips until torso and thighs roughly align, then lower.','固定训练凳，不用腰部反弓代替伸髋。|벤치를 고정하고 허리 과신전으로 대신하지 마세요.|Secure bench; do not substitute lumbar arching for hip extension.'],
['hipabduction','髋外展|힙 어브덕션|Hip abduction','hipout,band','abductors,glutes','core','坐姿机型：坐稳，腿外侧贴垫；弹力带按指导放置。|머신은 다리 바깥을 패드에 대고 앉습니다. 밴드는 지도로 배치.|Machine: sit with outer legs against pads; position bands with guidance.','双腿向外打开，再控制回位。|다리를 밖으로 벌리고 천천히 복귀.|Move legs outward and return with control.','不甩腿或过度打开；臀肌与外展肌区域有重叠。|반동이나 과한 벌림을 피하세요. 둔근·외전근 영역은 겹칩니다.|Avoid swinging/excess range; gluteal and abductor regions overlap.'],
['hipadduction','髋内收|힙 어덕션|Hip adduction','hipin','adductors','core','坐稳，腿内侧贴垫，起始打开角度在舒适范围。|다리 안쪽을 패드에 대고 편안한 벌림 각도에서 앉습니다.|Sit with inner legs against pads at a comfortable opening angle.','将双腿合拢，再缓慢打开。|다리를 모으고 천천히 벌립니다.|Bring legs together and open slowly.','不强行拉开髋部，不用惯性。|고관절을 억지로 벌리거나 반동을 쓰지 마세요.|Avoid forced hip opening and momentum.'],
['standingcalf','站姿提踵|스탠딩 카프 레이즈|Standing calf raise','standcalf,dumbbell,smith','calves','core','脚掌稳放平台，膝不锁死，扶稳支撑。|발 앞부분을 안정시키고 무릎을 잠그지 않으며 지지대를 잡습니다.|Place forefeet securely, keep knees unlocked and use support.','抬脚跟，再控制下落。|뒤꿈치를 올리고 천천히 내립니다.|Raise heels and lower with control.','不弹震、不让脚踝侧翻。|튀거나 발목을 옆으로 꺾지 마세요.|Avoid bouncing and rolling ankles sideways.'],
['seatedcalf','坐姿提踵|시티드 카프 레이즈|Seated calf raise','seatcalf','calves','','坐稳，前脚掌在踏板，大腿垫固定。|앞발을 발판에 두고 허벅지 패드를 고정해 앉습니다.|Sit with forefeet on platform and thighs under pad.','抬脚跟顶起垫，再缓慢放下。|뒤꿈치를 들어 패드를 올리고 천천히 내립니다.|Lift heels to raise pad, then lower slowly.','先了解释放与锁定装置，避免脚滑落。|해제·잠금 장치를 익히고 발이 미끄러지지 않게 하세요.|Learn release/lock controls and avoid foot slipping.'],
['crunch','器械卷腹|머신 크런치|Machine crunch','crunchmachine','core','','调座位，按机型固定身体，握把不过度用力。|좌석과 지지를 맞추고 손잡이를 과하게 당기지 않습니다.|Adjust seat/supports and grip without pulling excessively.','腹部发力屈躯干，再控制伸回。|복부로 몸통을 굽히고 천천히 폅니다.|Flex the trunk with abdominal effort and return with control.','不以手臂猛拉或颈部前伸代偿。|팔로 세게 당기거나 목을 내밀어 보상하지 마세요.|Avoid arm-pulling or neck-jutting compensation.'],
['legraise','双杠抬腿|캡틴 체어 레그 레이즈|Captain’s chair leg raise','captain','core','forearms,shoulder','前臂支撑，背靠垫，身体稳定；髋屈肌亦参与。|팔뚝으로 지지하고 등을 대며 안정시킵니다. 고관절 굴곡근도 관여.|Support forearms and back, steady body; hip flexors also participate.','控制抬膝或抬腿，轻卷骨盆，再放下。|무릎 또는 다리를 조절해 들며 골반을 살짝 말고 내립니다.|Raise knees or legs with controlled pelvic curl, then lower.','不摆荡；单纯抬腿不能等同仅练腹肌。|흔들지 마세요. 다리 들기는 복근만의 운동이 아닙니다.|Avoid swinging; leg lifting is not exclusively abdominal work.'],
['rollout','健腹轮训练|앱 휠 롤아웃|Ab wheel rollout','wheel,mat','core','shoulder,back','跪在垫上，双手握轮，收紧腹部，背部自然。|매트에 무릎을 대고 휠을 잡아 복부를 긴장시킵니다.|Kneel on mat, grip wheel, brace abdomen and keep natural spine.','向前滚至能保持躯干控制的距离，再拉回。|몸통 조절 가능한 거리까지만 굴리고 돌아옵니다.|Roll forward only as far as trunk control allows, then return.','不塌腰；从短距离开始，能力不足则不做。|허리를 처뜨리지 말고 짧게 시작, 조절 안 되면 하지 마세요.|Avoid sagging; start short and omit if control is insufficient.'],
['swing','壶铃摇摆|케틀벨 스윙|Kettlebell swing','kettlebell','glutes,hamstrings','core,forearms,lowerback','双手握壶铃，屈髋，膝略屈，保持背部控制。|양손으로 잡고 고관절을 접으며 무릎을 살짝 굽히고 등을 조절.|Hold with both hands, hinge with soft knees and controlled spine.','用伸髋驱动壶铃向前摆起，再顺势屈髋回摆。|고관절 폄으로 앞쪽 스윙 후 다시 고관절을 접습니다.|Drive forward with hip extension, then hinge for backswing.','先学髋铰链，不用肩部主动提举或腰部反弓。|힙 힌지를 먼저 배우고 어깨로 들거나 허리를 젖히지 마세요.|Learn the hip hinge first; avoid arm lifting and back hyperextension.'],
['trxrow','TRX划船|TRX 로우|TRX row','trx','back,upperback','biceps,forearms,core','检查固定点，握把，身体后倾成一直线。|고정점을 확인하고 손잡이를 잡아 몸을 일직선으로 뒤로 기울입니다.|Check anchor, grip handles and lean back in a straight body line.','屈肘将胸部拉向把手，再缓慢伸臂。|팔꿈치를 굽혀 가슴을 손잡이 쪽으로 당기고 천천히 폅니다.|Bend elbows to draw chest toward handles, then extend slowly.','脚越向前通常越难；先选易控角度，不塌腰。|발이 앞일수록 대체로 어렵습니다. 쉬운 각도부터, 허리 처짐 피하기.|Feet farther forward generally increases difficulty; start easy and avoid sagging.'],
['battle','战绳交替甩动|배틀 로프 교대 웨이브|Alternating battle rope waves','ropes','shoulder','core,forearms,quads','确认绳固定，双脚站稳，屈髋微蹲，各握一端。|로프를 고정하고 안정된 약한 스쿼트 자세로 양끝을 잡습니다.|Check anchor, use steady shallow squat/hinge and grip both ends.','双臂交替上下产生连续波浪。|양팔을 번갈아 위아래로 움직여 파도를 만듭니다.|Alternate arms up and down to create continuous waves.','保持呼吸与躯干控制，清空绳摆动空间。|호흡·몸통을 조절하고 로프 공간을 비우세요.|Maintain breathing and trunk control; clear rope space.'],
['boxjump','跳箱训练|박스 점프|Box jump','box','quads,glutes,calves','core,hamstrings','选择低且稳固的跳箱，双脚站稳，先练落地。|낮고 안정된 박스를 고르고 먼저 착지를 연습합니다.|Choose a low stable box and practice landing first.','摆臂蹬地跳上箱，屈髋屈膝吸收落地，再走下。|팔과 다리로 뛰어 올라 고관절·무릎을 굽혀 착지하고 걸어 내려옵니다.|Jump onto box, land with soft hips/knees, then step down.','不选过高箱，不疲劳勉强跳，初学需指导。|너무 높은 박스나 피로한 점프를 피하고 초보자는 지도 필요.|Avoid excessive height or fatigued jumps; beginners need guidance.']];
moves.splice(0,moves.length,...moveRows.map(([id,n,eq,main,support,start,process,safety])=>{movementMeta[id]={safety:safety.split('|'),demo:null};return [id,n.split('|'),eq.split(','),main.split(','),support?support.split(','):[],start.split('|'),process.split('|'),'none']}));

let lang=0,page='welcome',selected=null,query='',backView=false,playing=true,loop=true,tick=0,animFrame,lastFrame=0;const $=s=>document.querySelector(s),tr=x=>Array.isArray(x)?x[lang]:x;
const ui={home:T('虚拟健身房','가상 헬스장','Virtual gym'),start:T('开始探索','탐험 시작','Enter the gym'),intro:T('认识身体，探索运动，将每一次好奇变成真实的体验。','몸을 이해하고 스포츠를 탐험하며 호기심을 실제 경험으로 연결하세요.','Understand your body. Discover new ways to move. Turn curiosity into real experience.'),online:T('线上已了解','온라인 학습 완료','Learned online'),offline:T('线下已体验','오프라인 경험 완료','Experienced offline'),learn:T('记录已了解','학습 기록','Mark as learned'),record:T('记录实际体验','실제 경험 기록','Record an experience'),main:T('主要肌群','주요 근육','Primary muscles'),assist:T('辅助肌群','보조 근육','Supporting muscles'),related:T('关联探索','연관 탐험','Connected discoveries'),claim:T('领取任务','퀘스트 받기','Accept quest'),done:T('标记完成','완료 표시','Mark complete'),active:T('进行中','진행 중','In progress'),complete:T('已完成','완료','Completed'),empty:T('还没有记录，去探索第一站吧。','아직 기록이 없습니다. 첫 탐험을 시작하세요.','Your first discovery is waiting. Start exploring.'),note:T('体验感受 / 使用情况','경험 및 사용 메모','Experience / usage notes'),save:T('保存记录','기록 저장','Save record'),cancel:T('取消','취소','Cancel'),safety:T('基本注意事项','기본 주의사항','Safety essentials'),gear:T('初学者装备','초보자 준비물','Beginner equipment'),process:T('动作过程与注意事项','동작 과정 및 주의사항','Movement & precautions'),pose:T('起始姿势','시작 자세','Starting position'),search:T('搜索器械、肌肉或动作…','기구, 근육, 동작 검색…','Search equipment, muscles or movements…'),saved:T('已保存至运动探索护照','운동 여권에 저장했습니다','Saved to your fitness passport'),local:T('进度保存在当前浏览器 · 线上学习与线下体验分别记录','진행 상황은 현재 브라우저에 저장 · 학습과 실제 경험 별도 기록','Saved in this browser · Online learning and offline experience are separate')};
let state={learned:[],records:[],quests:{},scenarios:[]};try{const s=JSON.parse(localStorage.getItem('movequest-v1'));if(s&&Array.isArray(s.learned)&&Array.isArray(s.records)&&s.quests&&Array.isArray(s.scenarios))state=s;lang=Number(localStorage.getItem('movequest-lang'))||0;if(!Number.isInteger(lang)||lang<0||lang>2)lang=0}catch(e){}let memoryOnly=false;
function persist(){try{localStorage.setItem('movequest-v1',JSON.stringify(state));localStorage.setItem('movequest-lang',lang)}catch(e){memoryOnly=true;toast(T('浏览器禁止本地保存，本次记录仅在当前页面保留。','브라우저가 저장을 차단하여 현재 페이지에서만 유지됩니다.','Browser storage is blocked; records will last only for this page session.'))}}
function toast(t){$('#toast').textContent=tr(t);$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3000)}
function go(p,id=null){page=p;selected=id;query='';render();window.scrollTo(0,0)}
function btn(text,action,cls=''){return `<button type="button" class="${cls}" onclick="${action}">${tr(text)}</button>`}function chip(text,action){return btn(text,action,'chip')}
function links(ids,kind){const arr=kind==='muscle'?muscles:kind==='equipment'?equipment:moves;return ids.map(id=>{let a=arr.find(x=>x[0]===id);return chip(a[1],`go('${kind}','${id}')`)}).join('')}
function learn(kind,id){let key=kind+':'+id;if(!state.learned.includes(key))state.learned.push(key);persist();toast(ui.saved);render()}
function actions(kind,id){const learned=state.learned.includes(kind+':'+id);return `<div class="actions">${btn(learned?ui.online:ui.learn,`learn('${kind}','${id}')`,learned?'checked':'primary')}${btn(ui.record,`record('${kind}','${id}')`)}${btn(ui.claim,`claim('on-${kind}-${id}');go('quest')`)}</div>`}
function nameFor(kind,id){return (kind==='muscle'?muscles:kind==='equipment'?equipment:kind==='move'?moves:sports).find(x=>x[0]===id)?.[kind==='sport'?2:1]||T('健身房情境练习','헬스장 상황 연습','Gym scenarios')}
function record(kind,id){const d=document.createElement('dialog');d.innerHTML=`<form><span class="eyebrow">${moduleName(modules[6])}</span><h2>${tr(ui.record)} · ${tr(nameFor(kind,id))}</h2><label>${tr(ui.note)}<textarea required maxlength="1000" rows="5"></textarea></label><div class="actions">${btn(ui.cancel,"this.closest('dialog').close()") }<button class="primary" type="submit">${tr(ui.save)}</button></div></form>`;document.body.append(d);d.querySelector('form').onsubmit=e=>{e.preventDefault();state.records.push({kind,id,note:d.querySelector('textarea').value.trim(),date:new Date().toISOString()});persist();d.close();toast(ui.saved);render()};d.addEventListener('close',()=>d.remove());d.showModal()}
let questList=[];function makeQuests(){questList=[];for(let [kind,arr] of [['muscle',muscles],['equipment',equipment],['move',moves],['sport',sports]])for(let a of arr){questList.push({id:'on-'+kind+'-'+a[0],kind,key:a[0],off:false});if(kind!=='muscle')questList.push({id:'off-'+kind+'-'+a[0],kind,key:a[0],off:true})}questList.push({id:'scenario',kind:'scenario',key:'all',off:false})}makeQuests();
function claim(id){if(!state.quests[id])state.quests[id]='active';persist();toast(T('任务已领取','퀘스트를 받았습니다','Quest accepted'))}
function evidence(q){if(q.kind==='scenario')return state.scenarios.length===3;return q.off?state.records.some(r=>r.kind===q.kind&&r.id===q.key):state.learned.includes(q.kind+':'+q.key)}
function finish(id){let q=questList.find(q=>q.id===id);if(!evidence(q)){toast(q.off?T('请先记录这项实际体验。','먼저 실제 경험을 기록하세요.','Record this offline experience first.'):T('请先完成对应学习；情境任务需答对全部三题。','먼저 해당 학습을 완료하세요. 상황 퀘스트는 세 문제를 모두 맞혀야 합니다.','Complete the linked learning first; scenarios require all three correct answers.'));return}state.quests[id]='done';persist();render();toast(T('任务完成，获得探索成就！','퀘스트 완료! 탐험 배지를 획득했습니다.','Quest complete. Discovery achievement earned!'))}
function setLanguage(value){
  const next=Number(value);
  if(!Number.isInteger(next)||next<0||next>2)return;
  lang=next;
  render();
  persist();
}

function home(){let done=Object.values(state.quests).filter(v=>v==='done').length;return `<div class="breadcrumb">MOVEQUEST / ${tr(ui.home)}</div><section class="home-hero"><div><span class="eyebrow">${tr(labels.adventure)}</span><h1>${tr(T('让好奇心，<br>带你动起来。','호기심을 따라,<br>움직여 보세요.','Follow your curiosity.<br>Find your next move.'))}</h1><p>${tr(ui.intro)}</p><div class="hero-pills"><span>◉ ${tr(T('自由探索','자유로운 탐험','Explore freely'))}</span><span>↗ ${tr(T('真实体验','실제 경험','Experience more'))}</span></div></div>${heroArt()}</section><section class="section-heading"><div><span class="eyebrow">${tr(labels.next)}</span><h2>${tr(T('探索你的运动版图','나의 운동 지도를 펼치세요','Where will you go next?'))}</h2></div><span class="muted">07 ${tr(T('个探索入口','개의 탐험 입구','places to begin'))}</span></section><div class="module-grid">${modules.map((m,i)=>`<button class="module-card module-${i}" onclick="go('${['survival','muscle','equipment','move','sport','quest','passport'][i]}')"><div class="card-top"><span class="module-icon">${m[3]}</span><span class="module-num">${m[2]} / 07</span></div><small>${moduleName(m)}</small><h3>${tr(m[1])}</h3><p>${tr(m[4])}</p><span class="card-arrow">↗</span></button>`).join('')}<div class="progress-card"><span class="eyebrow">${tr(labels.exploration)}</span><strong>${state.learned.length}<span> / ${muscles.length+equipment.length+moves.length+sports.length}</span></strong><p>${tr(ui.online)}</p><div class="bar"><i style="width:${state.learned.length/38*100}%"></i></div><small>${state.records.length} ${tr(ui.offline)} · ${done} ${tr(ui.complete)}</small></div></div>`}
function title(index){let m=modules[index];return `<div class="breadcrumb">${tr(ui.home)} / ${moduleName(m)}</div><div class="page-title"><span class="eyebrow">${m[2]} / 07 — ${moduleName(m)}</span><h1>${tr(m[1])}</h1><p>${tr(m[4])}</p></div>`}

)?ui.main:ui.assist)}</span><div>${links(m[2],'equipment')}</div></div>`).join('')}${actions('muscle',a[0])}</article></div></div>`}

const zones=[T('有氧区｜跑步机、健身车等用于持续有氧活动。先了解启停与调节方式，再低强度开始。','유산소 구역 | 러닝머신과 실내 자전거를 사용합니다. 시작·정지·조절법을 익힌 뒤 낮은 강도로 시작하세요.','Cardio zone | Treadmills and exercise bikes support continuous aerobic activity. Learn stop/start and controls before beginning gently.'),T('固定器械区｜推胸机、下拉机和腿举机等提供导向阻力。使用前调节座椅与重量插销。','머신 구역 | 체스트 프레스, 랫 풀다운, 레그 프레스 등으로 저항 운동을 합니다. 좌석과 중량 핀을 먼저 조절하세요.','Machine zone | Chest press, pulldown and leg press machines provide guided resistance. Adjust the seat and weight pin first.'),T('自由重量区｜哑铃、杠铃等供多种力量练习。注意周围距离，不占用他人动作空间。','프리 웨이트 구역 | 덤벨과 바벨로 다양한 근력 운동을 합니다. 다른 사람의 운동 공간을 확보하세요.','Free-weight zone | Dumbbells and barbells support varied strength exercises. Leave enough room for others to move.'),T('垫上与伸展区｜训练垫用于地面核心和活动练习。保持通道畅通，使用后清洁归位。','매트 및 스트레칭 구역 | 매트로 코어와 가동성 운동을 합니다. 통로를 비우고 사용 후 청소하고 정리하세요.','Mat & mobility zone | Mats support floor-based core and mobility work. Keep walkways clear; clean and return equipment.')];

function drawMotion(time){let c=$('#motion');if(!c)return;let ctx=c.getContext('2d');if(lastFrame&&playing)tick+=(time-lastFrame)/3500;lastFrame=time;if(tick>=1){if(loop)tick%=1;else{tick=1;playing=false}}let t=(1-Math.cos(tick*Math.PI*2))/2,a=moves.find(m=>m[0]===selected),type=a[7];ctx.clearRect(0,0,700,340);ctx.fillStyle='#eef0e6';ctx.fillRect(0,0,700,340);ctx.strokeStyle='#d4d8ca';ctx.lineWidth=1;for(let x=0;x<700;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,340);ctx.stroke()}ctx.beginPath();ctx.moveTo(0,295);ctx.lineTo(700,295);ctx.stroke();function line(points,color='#243e30',width=12){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}function head(x,y){ctx.fillStyle='#243e30';ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill()}function weight(x,y){line([[x-13,y],[x+13,y]],'#829647',5);line([[x-13,y-9],[x-13,y+9]],'#829647',7);line([[x+13,y-9],[x+13,y+9]],'#829647',7)}let hip=[350,211],should=[350,125],elbow=[383,165],hand=[408,190],knee=[380,251],foot=[392,292];if(type==='squat'){hip=[325,211+40*t];should=[335,125+40*t];knee=[384,251+10*t];hand=[365,157+40*t];elbow=[381,180+40*t]}if(type==='press'){line([[330,120],[330,235],[395,235]],'#b6c1ad',10);hand=[390+70*t,142];elbow=[385+25*t,184-35*t];hip=[350,232];knee=[401,236];foot=[413,290]}if(type==='pull'){line([[300,60],[455,60],[455,290]],'#b6c1ad',9);hand=[397,76+64*t];elbow=[405,114+65*t];line([[365,hand[1]],[427,hand[1]]],'#829647',8);line([[397,60],[397,hand[1]]],'#a6b292',2);hip=[350,230];knee=[400,235];foot=[409,290]}if(type==='raise'){hand=[385+68*t,225-100*t];elbow=[370+30*t,178-48*t]}if(type==='curl'){hand=[403-13*t,219-84*t];elbow=[382,177]}if(type==='row'){hip=[335,205];should=[398,158];elbow=[408-30*t,204-42*t];hand=[398-30*t,250-44*t];knee=[345,251];foot=[320,292]}if(type==='leg'){hip=[320,220];should=[300,140];knee=[380+35*t,185];foot=[415+65*t,210-55*t];hand=[320, survivalPage=function(){return title(0)+`<div class="zone-grid">${zones.map((z,i)=>`<article class="detail"><span class="eyebrow">${tr(labels.zone)} 0${i+1}</span><p>${tr(z)}</p>${i===1?links(['press','pulldown','legpress'],'equipment'):i===2?links(['dumbbell','barbell','rack','power'],'equipment'):i===3?links(['mat','roller','band'],'equipment'):links(['treadmill','elliptical','spin','recumbent','erg','stairs','airbike'],'equipment')}</article>`).join('')}</div><h2>${tr(T('五项情境练习','다섯 가지 상황 연습','Five gym scenarios'))} <small>${state.scenarios.length}/5</small></h2><div class="zone-grid">${scenarioV2.map((s,i)=>`<article class="detail"><span class="eyebrow">${tr(labels.scenario)} 0${i+1}</span><h3>${tr(s.name)}</h3><p>${tr(s.intro)}</p><span class="tag">${tr(state.scenarios.includes(s.id)?ui.complete:T('未完成','미완료','Incomplete'))}</span>${s.options.map((o,n)=>btn(o,`scenarioAnswer('${s.id}',${n})`,'answer')).join('')}${s.id in scenarioFeedback?`<p class="${scenarioFeedback[s.id]?'success':''}">${tr(scenarioFeedback[s.id]?T('选择正确。','올바른 선택입니다.','Correct choice.'):T('此选择不合适，请阅读说明后重试。','적절하지 않습니다. 설명을 읽고 다시 선택하세요.','This choice is unsuitable; read the guidance and try again.'))}</p><h4>${tr(T('正确做法说明','올바른 행동 안내','Appropriate action'))}</h4><p>${tr(s.why)}</p>`:''}${state.scenarios.includes(s.id)?`<p class="success">✳ ${tr(T('情境学习成就已记录','상황 학습 배지 기록 완료','Scenario learning achievement recorded'))}</p>`:''}</article>`).join('')}</div><div class="actions">${btn(ui.claim,"claim('q5');showTasks('scenario','all')",'primary')}${taskLink('scenario','all')}</div>`};

function experienceDialog({kind,id,taskId=null}){let q=questV2.find(q=>q.id===taskId);let isFind=taskId==='q6',isTry=taskId==='q7',fixed=taskId==='q8'?'climb':taskId==='q10'?'hike':id;let choices=isFind?equipment.filter(e=>state.learned.includes('equipment:'+e[0])):isTry?equipment:sports;let d=document.createElement('dialog');let target=kind==='sport'||taskId&&!isFind&&!isTry?'sport':'equipment';let needsChoice=taskId&&!['q8','q10'].includes(taskId);d.innerHTML=`<form><span class="eyebrow">${moduleName(modules[6])}</span><h2>${tr(q?q.name:ui.record)}</h2>${q?`<p>${tr(q.condition)}</p>`:`<p>${tr(nameFor(kind,id))}</p>`}${needsChoice?isFind?`<fieldset><legend>${tr(T('选择已在网站学习并在现场找到的器械（至少3种）','학습했고 현장에서 찾은 기구 선택 (최소 3종)','Select learned equipment found in person (at least 3)'))}</legend>${choices.length?choices.map(a=>`<label class="check-line"><input type="checkbox" name="found" value="${a[0]}"> ${tr(a[1])}</label>`).join(''):`<p>${tr(T('请先学习至少3种器械。','먼저 기구 3종 이상 학습하세요.','Learn at least 3 equipment types first.'))}</p>`}</fieldset>`:`<label>${tr(isTry?T('使用的器械','사용한 기구','Equipment used'):T('体验的运动','경험한 스포츠','Sport experienced'))}<select name="choice" required>${choices.map(a=>`<option value="${a[0]}">${tr(a[isTry?1:2])}</option>`).join('')}</select></label>`:''}${isTry?`<label class="check-line"><input type="checkbox" name="guided" required> ${tr(T('我确认在适当指导下尝试了这项新器械。','적절한 지도하에 새 기구를 시도했음을 확인합니다.','I confirm that I tried this new equipment with suitable guidance.'))}</label>`:''}<label>${tr(V.date)}<input type="date" name="date" required max="${currentDateInput()}" value="${currentDateInput()}"></label><label>${tr(ui.note)}<textarea name="note" required maxlength="1000" rows="4"></textarea></label><label class="check-line"><input name="confirm" type="checkbox" required> ${tr(T('我确认这是本人实际完成的体验或现场寻找记录。','실제로 완료한 경험 또는 현장 찾기 기록임을 확인합니다.','I confirm this records my actual experience or equipment found in person.'))}</label><p class="form-error" role="alert"></p><div class="actions">${btn(ui.cancel,"this.closest('dialog').close()") }<button class="primary" type="submit">${tr(ui.save)}</button></div></form>`;document.body.append(d);d.querySelector('form').onsubmit=e=>{e.preventDefault();let form=e.currentTarget;let note=form.elements.note.value.trim();if(!note){d.querySelector('.form-error').textContent=tr(T('请填写实际体验。','실제 경험을 입력하세요.','Enter your actual experience.'));return}let found=isFind?Array.from(form.querySelectorAll('input[name="found"]:checked')).map(x=>x.value):[];if(isFind&&found.length<3){d.querySelector('.form-error').textContent=tr(T('请至少选择3种已学习且找到的不同器械。','학습했고 찾은 서로 다른 기구 3종 이상 선택하세요.','Select at least 3 distinct learned equipment types found in person.'));return}let actualId=needsChoice&&!isFind?form.elements.choice.value:fixed;let date=form.elements.date.value+'T12:00:00';const base={note,date,taskId,createdAt:now()};if(isFind){for(const eq of found)state.records.push({...base,kind:'equipment',id:eq,method:'found',idKey:now()+':'+eq});state.offlineEvidence.q6={count:found.length,date,ids:found}}else{let rec={...base,kind:taskId?target:kind,id:actualId,method:isTry?'guided':'experience',idKey:now()};state.records.push(rec);if(isTry)state.offlineEvidence.q7={count:1,date,ids:[actualId],guided:true};if(rec.kind==='sport')addSportEvidence(actualId,rec)}if(taskId&&!state.quests[taskId])state.quests[taskId]='active';persist();d.close();render();toast(ui.saved)};d.addEventListener('close',()=>d.remove());d.showModal()}

<script>
// Equipment-specific setup, start, operation, finish and safety, with localized text.
const equipmentGuides={};
const guideRows=[
['treadmill','确认安全夹与停止键，按机身说明设置低速和低坡度。|안전 클립·정지 버튼을 확인하고 기구 안내대로 저속·낮은 경사 설정.|Locate the safety clip and stop control; set low speed and incline per the machine.','按机型要求站在侧踏板或静止跑带上，夹好安全夹，扶稳。|기종 안내에 따라 측면 발판 또는 멈춘 벨트에 서서 안전 클립 고정.|Stand on side rails or a stopped belt as instructed; attach the safety clip and steady yourself.','低速启动后开始步行，站稳再逐步调速；目视前方，自然摆臂。|저속 시작 후 걷고 안정된 뒤 서서히 속도 조절; 앞을 보며 자연스럽게 팔 움직이기.|Begin walking at low speed, increase only once steady, look forward and move arms naturally.','逐步减速到步行，再按停止；跑带完全静止后取下安全夹并下机。|걷기 속도로 낮춘 뒤 정지; 벨트가 완전히 멈춘 후 클립을 풀고 하차.|Slow to a walk, stop the belt, then remove the clip and step off only after it stops.','不跳上高速跑带，不向后走动或弯腰捡物；失去平衡时使用停止装置。|고속 벨트에 뛰어오르거나 뒤로 걷거나 물건을 줍지 마세요; 균형을 잃으면 정지 장치 사용.|Do not jump onto a fast belt, walk backward or bend to retrieve objects; use the stop mechanism if unsteady.'],
['elliptical','检查踏板和把手牢固，阻力设低；有可调步幅时按机型说明设置。|페달·손잡이 고정 확인, 저항 낮게; 보폭 조절은 기종 안내 따르기.|Check pedals and handles; set low resistance and adjust stride only as instructed.','握固定把手，一脚踩稳再踏入另一脚，身体直立。|고정 손잡이를 잡고 한 발씩 올라가 바르게 섭니다.|Hold fixed handles and mount one foot at a time; stand upright.','以连续椭圆轨迹踩踏，膝随脚尖；活动把手按节奏轻推拉。|타원 궤도로 연속 페달링, 무릎은 발끝 방향; 움직이는 손잡이는 리듬에 맞게 사용.|Pedal smoothly in an elliptical path with knees tracking toes; coordinate moving handles.','降低速度，握固定把手，踏板完全停稳后逐脚下机。|속도를 낮추고 고정 손잡이를 잡아 페달이 멈춘 후 한 발씩 하차.|Slow down, hold fixed handles and dismount one foot at a time after pedals stop.','不在运动中上下机；不要把身体重量全部压在把手上。|움직일 때 승하차하지 말고 손잡이에 체중을 모두 싣지 마세요.|Do not mount or dismount while moving or hang all bodyweight on handles.'],
['spin','调座高、前后位置和把手，踏板最远点膝仍微屈；检查调节钮已锁紧。|안장 높이·앞뒤·핸들 조절, 가장 먼 페달에서 무릎 약간 굽힘; 조절부 잠금.|Adjust seat height, reach and bars so the knee stays slightly bent at full reach; lock adjustments.','按踏板结构固定双脚，坐稳，双手轻握把手。|페달 방식에 맞게 발을 고정하고 앉아 손잡이를 가볍게 잡습니다.|Secure feet as designed, sit steadily and hold bars lightly.','从轻阻力平稳踩踏开始，逐步调整阻力与速度，避免左右晃动。|낮은 저항으로 부드럽게 시작하고 저항·속도를 서서히 조절, 좌우 흔들림 피하기.|Pedal smoothly at light resistance, then adjust gradually without rocking side to side.','减速并按该机型方法停止飞轮，完全停稳后松开脚带下车。|속도를 줄이고 기종별 플라이휠 정지법 사용, 완전히 멈춘 뒤 발을 풀고 하차.|Slow down and stop the flywheel using its mechanism; release feet only once stopped.','飞轮可能继续带动踏板；先学紧急制动，不在高速时抽脚。|플라이휠이 페달을 계속 돌릴 수 있습니다; 비상 제동을 먼저 익히고 고속에서 발을 빼지 마세요.|The flywheel may keep pedals turning; learn emergency braking and never pull feet out at speed.'],
['recumbent','调整座椅距离，让踏板最远处膝微屈，确认滑轨锁定。|페달이 가장 멀 때 무릎이 약간 굽도록 좌석을 조절하고 레일 잠금 확인.|Adjust seat distance for a slightly bent knee at full reach and lock the rail.','背贴靠垫，脚放踏板并按说明固定，手握侧把。|등을 대고 발을 페달에 고정하며 옆 손잡이를 잡습니다.|Support the back, position and secure feet, and hold side handles.','低阻力开始连续踩踏，保持骨盆稳定，再缓慢增加阻力。|낮은 저항으로 연속 페달링, 골반 안정 후 저항 서서히 증가.|Pedal at low resistance with steady pelvis, increasing resistance gradually.','逐渐减速，踏板停稳后松脚带，扶稳起身。|천천히 속도를 낮추고 멈춘 뒤 발을 풀고 지지하며 일어납니다.|Slow to a stop, release foot straps and stand with support.','不锁膝，不用脚尖勉强够踏板，不在踩踏时调座位。|무릎 잠금·발끝으로 억지로 닿기·페달링 중 좌석 조절 피하기.|Avoid locked knees, straining to reach and adjusting the seat while pedaling.'],
['erg','调整脚托使绑带跨过脚掌较宽处，选择容易控制的阻尼；检查滑轨畅通。|발의 넓은 부분에 스트랩이 오도록 발판 조절, 조절 가능한 저항과 레일 확인.|Set footrests so straps cross the broad foot; choose manageable resistance and clear the rail.','坐在滑座，脚固定，握把，手腕自然，屈髋屈膝前移但不挤压过深。|좌석에 앉아 발을 고정하고 손목 중립으로 잡아 고관절·무릎을 접되 과하게 압축하지 않습니다.|Sit and secure feet, grip with neutral wrists and come forward without overcompressing.','先蹬腿，再适度展开躯干，最后将把手拉向下胸；回程先伸臂、再屈髋、最后屈膝。|다리-몸통-팔 순서로 당기고 복귀는 팔-고관절-무릎 순서.|Drive legs, then open torso, then draw handle toward lower chest; recover arms, hips, then knees.','逐步降低划频，将把手控制放回支架，松脚带后下机。|스트로크를 줄이고 손잡이를 거치대에 조절해 돌려놓은 뒤 발을 풀고 하차.|Reduce stroke rate, return the handle under control and release feet before dismounting.','不抢先屈肘，不猛甩腰或过度后仰；不要松手让拉索弹回。|팔을 먼저 굽히거나 허리를 젖히지 말고 케이블이 튕기도록 놓지 마세요.|Avoid arm-first pulling, back jerking and excessive lean; never release the handle to recoil.'],
['stairs','确认启动、停止与速度控制，选低速，检查鞋带与踏阶边缘。|시작·정지·속도 조절 확인, 저속 선택, 신발끈과 스텝 가장자리 확인.|Identify controls, choose low speed and check shoelaces and step edges.','扶稳扶手，按机型说明上机，脚掌稳放踏阶。|손잡이를 잡고 기구 안내대로 올라가 발을 안정시킵니다.|Use rails to mount as instructed and plant feet securely.','低速连续登阶，保持身体稳定，扶手用于平衡，避免悬挂体重。|저속으로 연속 오르고 몸을 안정시키며 손잡이는 균형용으로 사용.|Climb steadily at low speed; use rails for balance rather than hanging bodyweight.','减速并停止，踏阶静止后扶稳下机。|속도를 줄이고 멈춘 뒤 스텝이 정지하면 잡고 내려옵니다.|Slow and stop, then dismount with support after steps stop.','不跳阶，不在运转时跨出；发现跟不上节奏立即减速。|스텝을 건너뛰거나 운전 중 이탈하지 말고 속도를 따라가기 어려우면 낮추세요.|Do not skip steps or step out while moving; reduce speed if unable to keep pace.'],
['airbike','调座高使远端膝微屈，检查踏板及活动把手，了解停止方式。|먼 페달에서 무릎이 약간 굽도록 안장을 맞추고 페달·핸들·정지법 확인.|Set seat height for a soft knee at full reach; check pedals, moving handles and stopping.','坐稳，脚踏实，双手握活动把手；固定把手机型按说明使用。|앉아 발을 안정시키고 활동 손잡이를 잡습니다; 고정형은 안내 따르기.|Sit securely with feet planted and grip moving handles, or follow fixed-handle instructions.','先轻踩，再配合手臂推拉；速度增加时风阻增大，逐步适应。|가볍게 페달링 후 팔 밀기·당기기 결합; 속도 증가 시 저항이 커지므로 점진적으로.|Begin gently, coordinate arm push-pull, and increase gradually as air resistance rises with speed.','降低速度，风轮、踏板和把手停稳后下车。|속도를 낮추고 팬·페달·핸들이 멈춘 후 하차.|Slow down and dismount only when fan, pedals and handles stop.','活动把手会摆动，勿靠近其路径；不能用手强行挡停风轮。|핸들 이동 경로를 피하고 손으로 팬을 멈추지 마세요.|Stay clear of moving handle paths; never stop the fan with your hand.']
];
for(const [id,adjust,start,operate,finish,safety] of guideRows)equipmentGuides[id]={adjust:adjust.split('|'),start:start.split('|'),operate:operate.split('|'),finish:finish.split('|'),safety:safety.split('|')};
// Fixed strength machines: movement descriptions are taken from the site's existing exact movement entries.
const fixedGuideRows=[
['press','chestpress','调座高使把手约在胸部高度，确认重量插销插到底。|손잡이가 가슴 높이에 오도록 좌석 조절, 중량 핀 완전 삽입.|Set handles near chest height and fully insert the weight pin.','缓慢让把手回到起始位，重量片落稳，再松手起身。|손잡이를 천천히 복귀하고 중량이 내려앉은 뒤 놓고 일어나기.|Return handles slowly, let the stack settle, then release and stand.'],
['pecdeck','pecfly','调座椅和起始臂幅，避免肩部被过度向后牵拉；设置轻阻力。|좌석·시작 팔 각도를 조절해 과한 뒤쪽 어깨 당김을 피하고 낮은 저항 설정.|Adjust seat and starting arm range to avoid excessive shoulder stretch; set light resistance.','控制双臂回到限位，重量片落稳后离开臂垫。|팔을 시작 스톱으로 조절해 복귀하고 중량이 내려앉은 뒤 패드에서 나오기.|Return to the starting stops, settle the stack and leave the pads.'],
['shoulderpress','machineohp','调座高使把手在肩部附近，检查靠背和重量插销。|손잡이가 어깨 부근이 되게 좌석 조절, 등받이·핀 확인.|Set handles near shoulder level; check back support and weight pin.','控制把手降回起始点，重量落稳后松手，不直接放掉。|손잡이를 시작까지 낮추고 중량이 놓인 뒤 손을 풀기; 던지지 않기.|Lower to start and release only after the load rests; do not drop handles.'],
['lateral','machineraise','调座位使肩部与器械转轴适配，上臂接触臂垫，选轻重量。|어깨와 기구 축을 맞추고 위팔을 패드에 대며 낮은 중량 선택.|Adjust seat to align shoulder with machine axis; set arm pads and light load.','慢慢将臂垫降回，负重静止后放松手臂离座。|팔 패드를 천천히 내리고 중량이 멈춘 뒤 팔을 풀어 일어나기.|Lower arm pads slowly and leave the seat once the load rests.'],
['pulldown','lat','调整大腿垫固定双腿，确认横杆连接与重量插销。|허벅지 패드를 고정하고 바 연결·중량 핀 확인.|Adjust thigh restraints and check bar attachment and weight pin.','控制伸臂使横杆上升，重量片落稳后放杆；不让横杆弹回。|팔을 조절해 펴며 바를 올리고 중량이 놓이면 놓기; 튕겨 보내지 않기.|Extend arms under control and release the bar after the stack settles; avoid recoil.'],
['seatedrow','seatedrow','调座位与胸垫，确保握把可够到且不必含胸前探；检查重量。|좌석·가슴 패드를 맞춰 등을 둥글게 뻗지 않고 손잡이가 닿게 조절.|Set seat and chest pad so handles are reachable without rounding forward; check load.','控制手臂前伸到起始位，重量静止后松手离座。|팔을 천천히 앞으로 펴고 중량이 멈춘 뒤 놓고 일어나기.|Extend arms to start with control; release once the weight is at rest.'],
['roman','backext','调髋垫至髋褶附近以便屈髋，脚跟固定垫锁稳；初学不加重量。|고관절 접힘이 가능하게 패드를 맞추고 뒤꿈치를 고정; 초보자는 추가 중량 없이.|Set hip pad near hip crease, secure heels, and begin without extra load.','回到身体成线位置，握住把手保持平衡，稳定释放脚部后下凳。|몸을 일직선으로 되돌린 뒤 손잡이로 균형을 잡고 발을 안전하게 풀어 내려오기.|Return to a straight body line, hold handles and carefully release feet to dismount.'],
['legpress','leg','按机型调座距，使起始屈膝可控且骨盆不离垫；先确认安全锁与重量。|골반을 패드에 둔 채 조절 가능한 무릎 각도로 좌석 거리 조절; 안전 잠금·중량 확인.|Set seat distance for controlled knee flexion with pelvis supported; check safety lock and load.','受控回到机器起始限位；按机型重新锁定，确认负重支撑后再离座。|시작 스톱으로 조절해 복귀하고 기종대로 잠가 하중이 지지된 뒤 일어나기.|Return to the machine’s starting stop, re-engage locks as designed, and leave only once supported.'],
['legext','legextension','膝关节对齐机器转轴，滚垫在小腿前下方而非脚背，设置轻阻力。|무릎을 기구 축에 맞추고 롤러는 발등이 아닌 정강이 아래 앞쪽에, 저항 낮게.|Align knees with machine axis; set pad on lower front shins, not the feet, and choose light resistance.','慢慢屈膝回到起始位，重量落稳后退出滚垫。|천천히 무릎을 굽혀 복귀하고 중량이 놓인 뒤 롤러에서 발 빼기.|Bend knees back slowly, settle the load and move clear of the pad.'],
['pronecurl','legcurl','膝对齐转轴，滚垫位于踝后上方；调好身体位置使髋部贴垫。|무릎 축 정렬, 롤러는 발목 뒤 위쪽; 골반이 패드에 닿도록 조절.|Align knees with axis; set roller above back of ankles and hips against the pad.','缓慢伸膝回到起始位，重量落稳，再放开滚垫起身。|천천히 무릎을 펴 중량이 놓인 뒤 롤러를 벗어나 일어나기.|Extend knees slowly, settle the stack, then move out of the roller and rise.'],
['seatedcurl','legcurl','膝对齐机器转轴，调靠背与大腿固定垫；踝后上方接触下方滚垫。|무릎 축 정렬, 등받이·허벅지 고정 패드 조절; 발목 뒤 위쪽은 아래 롤러에.|Align knees with axis, adjust back and thigh restraint, and place lower roller above back of ankles.','控制伸膝返回，重量落稳后解开大腿固定垫，再移开双腿起身。|무릎을 조절해 펴고 중량이 놓이면 허벅지 패드를 풀어 다리를 빼고 일어나기.|Extend knees with control, settle load, release thigh pad and remove legs before standing.'],
['hipout','hipabduction','调起始腿幅和靠背，使腿外侧贴垫，避免髋部被强行打开。|시작 다리 폭·등받이를 조절해 다리 바깥을 패드에 대고 강한 벌림 피하기.|Set opening and backrest so outer legs contact pads without forcing hips apart.','控制双腿合回机器起始位，重量落稳后使用调节装置退出。|다리를 시작 위치로 조절해 모으고 중량이 놓이면 조절 장치로 나오기.|Bring legs back to start, settle load and use the adjustment mechanism to exit.'],
['hipin','hipadduction','按机型将双腿打开到舒适范围，使内侧贴垫；选择轻重量。|기종대로 편안한 범위로 다리를 벌려 안쪽을 패드에 대고 낮은 중량 선택.|Open legs comfortably as designed, with inner legs on pads; select a light load.','控制双腿打开返回，重量落稳后调回便于退出的位置。|다리를 천천히 벌려 복귀하고 중량이 놓이면 나오기 쉬운 위치로 조절.|Open legs back slowly, settle load and adjust to a safe exit position.'],
['hack','hacksquat','调安全挡和起始高度，肩背贴垫，选可控重量；先学习解锁和挂回。|안전 스톱·시작 높이 조절, 어깨·등을 대고 중량 선택; 해제·재잠금 학습.|Set stops and start height, support shoulders/back and learn release/re-rack controls.','推回可重新锁定的起始位，挂好安全锁并确认承重，再退出肩垫。|시작 위치로 밀어 안전 잠금을 걸고 하중 지지를 확인한 뒤 어깨 패드에서 나오기.|Return to the locking position, engage locks and confirm support before leaving shoulder pads.'],
['standcalf','standingcalf','调肩垫高度和起始限位，前脚掌稳放踏台，确认安全装置。|어깨 패드 높이·시작 스톱을 맞추고 앞발을 발판에 안정시켜 안전장치 확인.|Set shoulder pad height and stops; place forefeet securely and check safeties.','脚跟缓慢回落，将负重放回起始支撑并锁定，再退出肩垫。|뒤꿈치를 천천히 내려 하중을 시작 지지에 놓고 잠근 뒤 나오기.|Lower heels, return load to support and lock before leaving the shoulder pads.'],
['seatcalf','seatedcalf','调大腿垫在膝上方的下段大腿，前脚掌稳放踏台，先确认锁定杆。|패드를 무릎 위쪽 허벅지 아래에 맞추고 앞발을 안정시키며 잠금 레버 확인.|Set thigh pads just above knees, place forefeet securely and identify the locking lever.','抬跟使装置可挂回，按机型锁定并确认负重被支撑，再放松退出。|기종대로 하중을 재거치할 만큼 뒤꿈치를 들고 잠금·지지를 확인 후 나오기.|Lift enough to re-rack as designed, engage the lock and confirm support before exiting.'],
['preacher','preachercurl','调凳高使上臂贴满斜垫，准备轻哑铃或适合的杠铃，检查器材放置稳固。|위팔이 경사 패드에 닿도록 좌석 조절, 가벼운 덤벨·적절한 바 준비.|Set seat for full upper-arm support and prepare a light dumbbell or suitable bar safely.','控制放下重量并稳放支架或安全位置，再移开上臂起身。|중량을 조절해 내려 거치대나 안전한 곳에 놓고 팔을 빼서 일어나기.|Lower under control and place weight securely on a rack or safe surface before rising.'],
['curlmachine','preachercurl','调座椅使肘与机器转轴适配，上臂贴垫，选轻阻力。|팔꿈치가 기구 축에 맞게 좌석 조절, 위팔을 패드에 대고 저항 낮게.|Set seat for elbow-axis alignment, support upper arms and select light resistance.','缓慢伸肘回到机器起始位，重量片静止后松开把手起身。|팔꿈치를 천천히 펴 시작으로 복귀, 중량이 멈춘 뒤 손잡이를 놓고 일어나기.|Extend elbows slowly to machine start, settle stack and release handles before standing.'],
['tricepsmachine','extension','本图为高位滑轮下压型：检查把手连接和插销，调到适合站姿的高度。|그림은 높은 도르래 푸시다운형: 손잡이 연결·핀과 서기 높이 확인.|The illustration is a high-pulley pushdown type: check handle, pin and standing height.','缓慢屈肘回到起始位，让重量片静止后放开把手。|팔꿈치를 천천히 굽혀 복귀, 중량이 멈춘 뒤 놓기.|Bend elbows back slowly and release the handle only after the stack settles.'],
['crunchmachine','crunch','按机型调座椅、脚部或胸垫，把手应可轻松握到，选轻阻力。|기종에 따라 좌석·발 지지·가슴 패드 조절, 편하게 닿는 손잡이와 낮은 저항.|Adjust seat, feet or chest support for the model; ensure handles are reachable and resistance is light.','控制躯干伸回起始位，重量落稳后松手并移开固定垫。|몸통을 천천히 펴 시작으로 복귀, 중량이 놓이면 손과 지지 패드 해제.|Extend trunk back with control, settle weight and release handles/supports.'],
['captain','legraise','确认器械稳固，检查前臂垫、背垫与踏阶，无外加重量开始。|기구·팔 패드·등 패드·발판 고정 확인, 추가 중량 없이 시작.|Check frame, forearm pads, back pad and steps; start without extra load.','慢慢放下双腿停止摆动，脚踩回踏阶后再卸去前臂支撑下架。|다리를 천천히 내려 흔들림을 멈추고 발판에 발을 둔 뒤 팔 지지 풀고 내려오기.|Lower legs and stop swinging, regain the steps and then release arm support to dismount.']
];
for(const [id,moveId,adjust,finish] of fixedGuideRows){let m=entity('move',moveId);equipmentGuides[id]={adjust:adjust.split('|'),start:m[5],operate:m[6],finish:finish.split('|'),safety:movementMeta[moveId].safety}}
// Model-specific variants must not inherit the wrong body position.
equipmentGuides.pronecurl.start=T('俯卧于长垫，髋部贴垫，双手握稳，膝与转轴对齐，滚垫在踝后上方。','패드에 엎드려 골반을 대고 손잡이를 잡으며 무릎 축 정렬, 롤러는 발목 뒤 위쪽.','Lie prone with hips on the pad, grip supports, align knees with axis and place roller above back of ankles.');
equipmentGuides.seatedcurl.start=T('坐稳背贴垫，大腿被固定垫压稳，双腿置于下方滚垫上，膝对齐转轴。','등을 대고 앉아 허벅지를 패드로 고정하며 다리를 아래 롤러 위에, 무릎 축 정렬.','Sit with supported back and secured thighs; legs rest over the lower roller and knees align with the axis.');
equipmentGuides.curlmachine.start=T('坐稳，上臂贴垫，肘对齐机器转轴，双手握住机器把手。','앉아 위팔을 패드에 대고 팔꿈치를 축에 맞춰 기구 손잡이를 잡습니다.','Sit with upper arms supported, elbows aligned to the machine axis and hands on its handles.');
equipmentGuides.curlmachine.operate=T('保持上臂稳定，屈肘带动机器把手，再缓慢伸肘回位。','위팔을 고정하고 팔꿈치를 굽혀 기구 손잡이를 움직인 뒤 천천히 펴 복귀.','Keep upper arms still, bend elbows to move the machine handles and extend slowly to return.');
const otherGuideRows=[
['dumbbell','选择能控制的重量；可调哑铃按说明锁紧两端，清空活动空间。|조절 가능한 무게 선택, 조절식 덤벨 양끝 잠금과 주변 공간 확보.|Choose a manageable weight, lock adjustable ends as instructed and clear space.','稳握手柄，手腕自然；根据所选动作站稳、坐稳或在训练凳躺稳。|손잡이를 단단히 잡고 손목 중립, 선택 동작에 맞게 서거나 앉거나 벤치에 눕기.|Grip securely with neutral wrists; stand, sit or lie securely for the selected movement.','先在下方选择动作，按其起始与发力方向缓慢举起、控制还原；弯举、卧推、划船不可混用姿势。|아래 동작을 선택해 해당 자세·방향으로 들고 천천히 복귀; 컬·프레스·로우 자세 구분.|Choose a movement below and follow its posture and direction; lift and return with control, keeping curls, presses and rows distinct.','停止动作，稳定回到便于搬放的姿势，轻放地面或哑铃架。|멈추고 안전하게 옮길 자세로 돌아와 바닥이나 랙에 조심히 놓기.|Stop, regain a safe handling position and place dumbbells gently on the floor or rack.','不抛掷，双侧负荷与选定动作一致；开始或结束卧推动作时尤其注意搬放。|던지지 말고 선택 동작에 맞는 부하 사용; 벤치 프레스 시작·종료 시 운반 주의.|Do not throw weights; use loads appropriate to the movement and handle carefully when starting or finishing presses.'],
['barbell','核对杠铃与配重，两侧均衡装片并按器材说明固定；设置所需支架和保护。|바·플레이트 확인, 양쪽 균형 장착·고정, 랙·안전장치 설정.|Check bar and plates, load both sides evenly and secure as instructed; set supports and safeties.','先选择卧推、划船等具体动作，再按该动作握距和身体位置就位。|벤치 프레스·로우 등 동작을 선택하고 해당 그립·몸 위치 설정.|Choose a specific movement, then establish its grip and body position.','在可控负荷下沿所选动作路径移动杠铃，并缓慢返回；不把一种动作的姿势套用到另一种。|조절 가능한 부하로 선택 경로를 움직이고 천천히 복귀, 다른 동작 자세를 혼용하지 않기.|Move the bar along the selected movement path and return under control; do not mix postures across movements.','需要挂杠时缓慢接触两侧挂钩并确认承重；地面动作轻放后再卸片。|거치 시 양쪽 훅의 하중 지지 확인; 바닥 동작은 조심히 내려놓은 뒤 원판 제거.|For racking, confirm both hooks support the load; floor movements finish by setting the bar down before unloading.','卧推等使用适当保护与指导；不得在杠铃未放稳时卸片或转身离开。|벤치 프레스 등 적절한 보호·지도 사용; 안정 전에 원판 제거·이탈 금지.|Use suitable safeguards and guidance; never unload or turn away before the bar is secure.'],
['rack','调挂钩高度适配所选杠铃动作；有保护杆时按说明设定并检查锁定。|선택 바벨 동작에 맞게 훅 높이 조절, 안전바가 있으면 설정·잠금 확인.|Set hook height for the barbell movement and set/lock safety bars if provided.','确认架体稳定，身体居中，双手握稳杠铃，先用轻负荷熟悉出杠。|랙 안정 확인, 중앙에 서서 바를 잡고 낮은 부하로 언랙 연습.|Check stability, center yourself, grip the bar and practice unracking with a light load.','架体提供放置与安全支撑；取杠后按具体动作练习，结束前对准两侧挂钩。|랙은 거치·보호용; 언랙 후 해당 동작 수행, 종료 시 양쪽 훅에 정렬.|The rack supplies storage/support; perform the chosen movement after unracking and align both hooks before re-racking.','将杠放回两侧挂钩，确认牢固承重后才松手并卸片归位。|양쪽 훅에 바를 걸어 지지 확인 후 손을 놓고 원판 정리.|Place bar on both hooks, verify support and only then release and unload.','开放式深蹲架不一定具有完整保护杆；没有适当保护时不要尝试无法控制的重量。|개방형 랙에는 충분한 안전바가 없을 수 있으므로 보호 없이 과한 중량 금지.|Open squat racks may lack full safety bars; avoid unmanageable loads without suitable protection.'],
['power','按动作设置挂钩与保护杆高度，确认插销锁住且杠铃可安全落在保护杆上。|동작별 훅·안전바 높이 설정, 핀 잠금 및 바가 안전바에 안전하게 놓이는지 확인.|Set hooks and safeties for the movement; lock pins and confirm the bar can rest safely on them.','在架内居中站位或放好训练凳，握杠，轻负荷试出杠与回挂。|랙 중앙에 서거나 벤치 배치, 낮은 부하로 언랙·재거치 연습.|Center your stance or bench inside the rack and rehearse unracking/re-racking lightly.','在架内按具体杠铃动作移动，保持与立柱和保护杆有足够空间。|랙 안에서 바벨 동작을 수행하고 기둥·안전바 간격 유지.|Perform the barbell movement inside the rack with clearance from posts and safeties.','对准两侧挂钩挂回并确认承重，再依次卸片和复位器材。|양쪽 훅에 재거치·하중 확인 후 원판과 장비 정리.|Re-rack on both hooks, confirm support, then unload and restore equipment.','先用空杠确认保护杆高度；保护装置不能替代动作学习与必要的协助。|빈 바로 안전바 높이를 확인; 안전장치는 기술 학습·필요한 보조를 대체하지 않음.|Test safety height with an unloaded bar; safeties do not replace technique learning or needed assistance.'],
['smith','按动作调安全挡与起始挂点，熟悉旋转挂钩方式，先用轻负荷确认站位。|안전 스톱·시작 훅을 설정하고 회전 잠금법 학습, 낮은 부하로 발 위치 확인.|Set stops and starting hooks, learn the rotating lock and check stance with a light load.','本页以史密斯机深蹲为例：杠在上背肌肉处，双脚按导轨位置站稳。|여기서는 스미스 스쿼트 예시: 바를 상부 등 근육에 두고 레일에 맞춰 서기.|For the linked squat example, place bar on upper-back muscle and set feet for the rail path.','托住负重后解锁，控制屈髋屈膝下蹲，再沿导轨站起。|하중을 지지한 뒤 해제, 고관절·무릎을 접어 내려갔다 레일을 따라 일어나기.|Support the load before unlocking, squat with control, then rise along the rails.','回到可挂回高度，旋转挂钩锁住，确认两侧已支撑后退出。|재거치 높이로 돌아가 훅을 돌려 잠그고 양쪽 지지 확인 후 나오기.|Return to a locking height, rotate hooks into place and confirm support before exiting.','不将杠压在颈部；导轨限制路径，其他动作须另行获得适当指导。|목에 바를 대지 말고 레일 경로를 고려; 다른 동작은 별도 지도 필요.|Keep bar off the neck; the rail constrains movement, so obtain separate guidance for other exercises.'],
['cable','无负重拉动时调滑轮高度，确认插销和配件扣锁闭合，检查拉索。|하중이 걸리지 않은 상태에서 도르래 높이 조절, 핀·카라비너 잠금·케이블 확인.|Adjust pulley height without tension; check pins, closed attachment clips and cable condition.','选择绳索夹胸或三头肌下压等动作，按该动作站位，握稳配件后轻拉至受力。|케이블 플라이·푸시다운 등을 선택해 해당 위치에서 잡고 가볍게 장력 만들기.|Choose a cable movement, establish its stance and grip the attachment before gently taking tension.','沿所选动作方向平稳推拉，控制回程，让重量片之间避免撞击。|선택한 방향으로 부드럽게 밀거나 당기고 복귀 시 중량판 충돌 피하기.|Push or pull along the selected path and control return without crashing the stack.','慢慢让重量片落稳，确认无拉力后放开配件；调整高度前卸去张力。|중량이 내려앉아 장력이 없어지면 놓고, 높이 조절 전 장력 해제.|Settle the stack slowly and release only without tension; unload tension before adjustments.','不在受力时移动滑轮或更换配件，不站在他人的拉索路径中。|하중 상태에서 도르래 이동·부속 교체 금지, 타인 케이블 경로 피하기.|Never adjust pulleys or attachments under tension; stay clear of others’ cable paths.'],
['bench','按动作调整靠背和座面角度，确认调节插销完全锁定，凳脚放平稳。|동작별 등받이·좌석 각도 조절, 핀 완전 잠금과 바닥 안정 확인.|Set backrest and seat for the movement, fully lock adjustments and place legs stably.','按卧推、肩推或划船的要求坐、躺或单手支撑；接触点稳定后再拿重量。|프레스·로우에 맞춰 앉거나 눕거나 지지하고 안정 후 중량 잡기.|Sit, lie or support yourself for the chosen exercise; stabilize contact points before handling load.','训练凳提供支撑，不自行产生阻力；结合下方所选动作控制移动重量。|벤치는 지지용이며 저항원이 아님; 아래 선택 동작으로 중량 조절.|The bench provides support, not resistance; move weights according to the selected exercise below.','先安全放回重量，再起身；无人承重时才调节凳面并清洁归位。|중량을 먼저 안전하게 놓고 일어나며, 하중 없이 각도 조절·정리.|Secure weights before rising; adjust only when unoccupied and restore/clean afterward.','不站在凳面上，不在调节锁未扣稳时训练，避免凳脚滑动。|벤치 위에 서거나 잠금 없이 운동하지 말고 미끄러짐 피하기.|Do not stand on the bench, use unlocked adjustments or allow feet to slide.'],
['kettlebell','检查把手与壶体完整，选可控轻重量，清空前后摆动空间。|손잡이·몸체 상태, 조절 가능한 낮은 중량과 앞뒤 공간 확인.|Inspect handle/body, select a manageable light load and clear front/back space.','先学习双手握持和髋铰链；壶铃置于可安全拿起的位置，背部自然。|양손 그립·힙 힌지를 먼저 익히고 안전한 위치에서 자연스러운 등 유지.|Learn a secure two-hand grip and hip hinge first; place the bell for a safe pickup with natural spine.','以本站壶铃摇摆文字为例，接受指导后用伸髋驱动摆起，回摆时屈髋控制，不用肩部硬提。|스윙 설명은 지도 후 고관절 폄으로 추진하고 힌지로 복귀, 어깨로 억지로 들지 않기.|For the site’s swing instructions, get guidance, drive with hip extension and hinge on return without arm-lifting the bell.','逐步降低摆幅，保持握持，将壶铃受控放回地面后松手。|스윙 폭을 줄이며 잡은 채 조절해 바닥에 놓고 손 놓기.|Reduce swing amplitude, maintain grip and set the bell down under control before release.','未掌握髋铰链前不自行练摆动；不追求高度或用腰部反弓。|힙 힌지를 익히기 전 스윙 독학 금지, 높이·허리 과신전 추구 금지.|Do not self-teach ballistic swings before learning the hinge; avoid chasing height or arching the back.'],
['medicine','先确认球的类型、重量及产品允许的用途；不是所有药球都可砸地。|볼 종류·무게·허용 용도를 확인; 모든 볼이 슬램용은 아님.|Check ball type, weight and permitted use; not all medicine balls are slam-rated.','从轻球双手胸前抱持开始，站稳，肘微屈，保持周围无人。|가벼운 볼을 가슴 앞에 양손으로 들고 안정적으로 서며 공간 확보.|Start with a light two-hand hold at the chest, steady stance and clear surroundings.','先练稳定持球及受控搬放；抛接、旋转或砸地仅按产品要求和现场指导进行。|안정된 홀드·조절된 이동부터, 던지기·회전·슬램은 제품 안내와 지도에 따르기.|Practice stable holds and controlled handling first; throwing, rotation or slams require product suitability and guidance.','停止动作，双手控制将球放回地面或球架，避免滚入通道。|멈추고 양손으로 바닥·랙에 놓아 통로로 굴러가지 않게 하기.|Stop and return the ball with both hands, preventing it rolling into walkways.','不把普通药球当反弹球使用；未知反弹方向时不对墙或地面猛砸。|일반 볼을 반동 볼처럼 쓰지 말고 반발 방향을 모르면 강하게 던지지 않기.|Do not assume rebound capability or slam into surfaces when rebound behavior is unknown.'],
['ropes','检查绳体与固定点，展开双绳，清空摆动范围，选择可控制的长度。|로프·앵커 상태 확인, 두 줄을 펴고 이동 공간·조절 가능한 길이 확보.|Inspect ropes and anchor, lay both out and clear the wave area with manageable length.','双脚站稳，屈髋微蹲，双手各握一端，躯干保持控制。|안정된 얕은 스쿼트·힌지 자세로 양끝을 잡고 몸통 조절.|Stand in a controlled shallow squat/hinge and grip one end in each hand.','双臂交替上下甩动形成波浪，保持呼吸，不用全身猛烈摆动。|팔을 교대로 위아래 움직여 파도를 만들고 호흡 유지, 몸 전체 반동 피하기.|Alternate arm waves while breathing steadily and avoiding violent whole-body swinging.','逐步减小摆幅，待绳子静止后轻放手柄并整理绳体。|폭을 줄이고 로프가 멈추면 손잡이를 놓아 정리.|Reduce wave amplitude, wait for ropes to stop and place handles down neatly.','不将绳绕在手腕或身体上，不让他人进入绳波范围。|손목·몸에 감지 말고 타인이 파도 범위에 들어오지 않게 하기.|Do not wrap ropes around wrists/body or allow others into the wave area.'],
['trx','按产品说明固定承重点，检查带体和扣具；对称调长度并拉紧测试固定。|제품 안내대로 앵커 고정, 스트랩·버클 확인, 대칭 길이 조절 후 고정 테스트.|Anchor as instructed, inspect straps/buckles, set equal lengths and test security.','本站以TRX划船为例：握把，脚踩稳，身体后倾成一直线，先选较直立角度。|TRX 로우 예시: 잡고 발을 안정시켜 몸을 일직선으로 뒤로 기울이며 쉬운 각도부터.|For TRX rows, grip handles, plant feet and lean back in a straight line at an easier upright angle.','屈肘把胸部拉向把手，再慢慢伸臂回位，躯干不塌。|팔꿈치를 굽혀 가슴을 손잡이로 당기고 천천히 펴며 몸통 유지.|Bend elbows to draw chest toward handles, then extend slowly without sagging.','脚向后调整使身体更直立，解除带体张力后再松手。|발을 뒤로 조절해 더 똑바로 선 후 장력을 풀고 손 놓기.|Step back to become more upright, remove tension and then release handles.','门锚等安装须遵守产品要求；固定点未知或带体磨损时不使用。|도어 앵커 등 설치 지침 준수, 불확실한 앵커·마모 스트랩 사용 금지.|Follow anchoring instructions; do not use uncertain anchors or worn straps.'],
['box','检查箱体稳固防滑，选择低高度，留足上方和周边空间。|박스 안정·미끄럼 확인, 낮은 높이와 위·주변 공간 확보.|Check stability/grip, choose a low height and clear overhead/surrounding space.','双脚面对箱体站稳，先在指导下练习地面落地与安全走下。|박스를 향해 서고 지도로 지면 착지·걸어 내려오기부터 연습.|Face the box steadily; learn landing and safe step-downs with guidance first.','仅在具备能力并受指导时起跳上箱，屈髋屈膝吸收落地，站稳后再移动。|능력과 지도가 있을 때만 뛰어올라 고관절·무릎을 굽혀 착지하고 안정 후 이동.|Jump only when capable and coached; absorb landing with hips/knees and stabilize before moving.','站稳后逐脚走下，恢复平衡后再进行下一次，避免直接反弹跳下。|안정 후 한 발씩 걸어 내려와 균형 회복, 바로 튕겨 내려오지 않기.|Step down one foot at a time and recover balance; avoid immediate rebound jumps down.','疲劳或无法稳落时停止；不以追求高度为目标，不在松动箱体上练习。|피로나 불안정 착지 시 중단, 높이 추구·흔들리는 박스 사용 금지.|Stop with fatigue or unstable landings; do not chase height or use a loose box.'],
['roller','选可耐受的硬度，将泡沫轴放在平整防滑地面；留出移动空间。|견딜 수 있는 경도를 고르고 평평한 미끄럼 방지 바닥과 이동 공간 확보.|Choose tolerable firmness and place the roller on a flat, non-slip floor with space.','以大腿肌肉软组织为例，将滚轴置于肌腹下，用手臂和另一条腿分担重量。|허벅지 근육 예시로 근복 아래 놓고 팔·반대 다리로 체중 분산.|For thigh soft tissue, place it under the muscle belly and support weight with arms/other leg.','缓慢小范围滚动，用支撑点控制压力；这不是力量训练，不追求忍痛。|지지로 압력을 조절하며 천천히 작게 롤링; 근력 운동이 아니며 통증 참기 금지.|Roll slowly over a short range, controlling pressure with supports; this is not strength work and should not require enduring pain.','停止滚动，用支撑点移开体重，取出滚轴后缓慢起身并清洁。|멈추고 지지로 체중을 옮겨 롤러를 뺀 뒤 천천히 일어나 청소.|Stop, shift weight onto supports, remove the roller, rise slowly and clean it.','不直接压关节、骨性突起、腰椎或受伤部位；出现疼痛麻木立即停止。|관절·뼈 돌출·요추·손상 부위 직접 압박 금지, 통증·저림 시 중단.|Avoid direct pressure on joints, bony areas, lumbar spine and injuries; stop for pain or numbness.'],
['ball','选择可耐受的球硬度，检查表面；初学可用墙面控制压力，避免全身压上。|견딜 수 있는 경도·표면 확인, 초보자는 벽으로 압력 조절, 체중 전체 압박 피하기.|Choose tolerable firmness and inspect surface; use a wall to control pressure rather than full bodyweight.','以背部肩胛周围软组织为例，将球放在墙与肌肉之间，避开脊柱与骨点。|견갑 주변 연부조직 예시로 벽과 근육 사이에 놓고 척추·뼈 피하기.|For soft tissue around the shoulder blade, place ball against a wall, avoiding spine and bone.','身体轻靠墙，缓慢小范围移动，始终用双脚控制压力，不强压痛点。|발로 압력을 조절하며 벽에 살짝 기대 천천히 작게 이동, 통증점 강압 금지.|Lean gently and move slowly over a small area; control pressure with feet and avoid forcing painful spots.','身体离墙解除压力，再取下球，不突然撤去支撑。|벽에서 천천히 떨어져 압력을 풀고 볼을 꺼내기, 갑작스러운 지지 해제 금지.|Move away to release pressure before retrieving the ball; do not remove support abruptly.','避开颈前、关节、脊柱与受伤处；疼痛或麻木时停止，不把滚压当诊疗。|목 앞·관절·척추·손상 피하고 통증·저림 시 중단, 치료로 간주하지 않기.|Avoid front of neck, joints, spine and injuries; stop for pain/numbness and do not treat rolling as medical care.'],
['mat','在平整防滑地面展开，检查边缘不卷起，周围留足伸展空间。|평평한 미끄럼 방지 바닥에 펴고 말린 가장자리·주변 공간 확인.|Unroll on a flat, non-slip floor, check curled edges and allow movement space.','双手、前臂或膝按所选地面动作放稳，先检查垫子不滑。|선택한 바닥 동작대로 손·팔뚝·무릎을 안정시키고 미끄럼 확인.|Position hands, forearms or knees for the chosen floor movement and check grip.','地垫只提供接触面；进行所选动作时保持支撑点稳定，按步骤控制移动。|매트는 접촉면만 제공; 선택 동작의 지지와 조절 유지.|The mat only provides a surface; maintain stable contacts and controlled movement for the chosen exercise.','先恢复稳定坐姿或跪姿，再起身，清洁晾干后卷起收好。|안정된 앉기·무릎 자세로 돌아온 뒤 일어나 닦고 말려 보관.|Regain a stable seated/kneeling posture before rising; clean, dry and store the mat.','地垫不能代替跌落防护；湿滑、折叠或接近通道时先调整。|낙상 보호 대체 불가; 젖음·접힘·통로 근접 시 먼저 조정.|A mat is not fall protection; correct wet, folded or obstructive placement first.'],
['wheel','检查轮轴、手柄与地面，垫住膝部，先设短的可控滚动距离。|축·핸들·바닥 확인, 무릎 패드와 짧고 조절 가능한 거리 설정.|Inspect axle, handles and floor; cushion knees and choose a short controllable range.','跪在垫上双手握轮，轮在身体前方，腹部收紧，背部自然。|매트에 무릎을 대고 앞의 휠을 양손으로 잡아 복부 긴장·등 자연스럽게.|Kneel on a mat, grip the wheel in front, brace abdomen and keep a natural spine.','缓慢向前滚，只到能维持腰部控制的位置，再受控拉回；不塌腰。|허리 조절 가능한 범위까지만 천천히 굴리고 조절해 복귀, 허리 처짐 금지.|Roll forward only while lumbar control is maintained, then return under control without sagging.','将轮拉回稳定跪姿，轮子停止后松手，缓慢起身。|안정된 무릎 자세로 돌아와 휠이 멈춘 뒤 손을 놓고 천천히 일어나기.|Return to stable kneeling, stop the wheel, release and rise slowly.','失去躯干控制或出现腰部疼痛就停止；不能完成短距离时不继续加远。|몸통 조절 상실·허리 통증 시 중단, 짧은 거리도 안 되면 늘리지 않기.|Stop with loss of trunk control or back pain; do not extend range if a short rollout is uncontrolled.'],
['band','检查裂口和磨损，选轻阻力；若动作需要固定点，严格按产品方法固定并先测试。|균열·마모·낮은 저항 확인, 앵커 필요 시 제품 방식대로 고정·테스트.|Inspect tears/wear and choose light resistance; anchor and test exactly as instructed if required.','先选择明确的弹力带动作，握稳或按说明佩戴，身体避开可能回弹路径。|명확한 밴드 동작을 고르고 안내대로 잡거나 착용, 반동 경로 피하기.|Choose a defined band exercise, grip or position it as instructed and stay clear of recoil paths.','在产品允许拉伸范围内缓慢拉开并控制回收，保持固定点和握持稳定。|허용 신장 범위 내에서 천천히 늘리고 조절해 돌아와 앵커·그립 유지.|Stretch and return slowly within product limits, maintaining secure anchors and grip.','先缓慢解除张力，再松手或移除固定，不让带体弹回。|장력을 천천히 푼 뒤 손·고정을 풀고 튕기지 않게 하기.|Remove tension gradually before releasing grip or anchors; prevent snapping back.','不使用破损带，不绕颈，不对着脸拉伸；未明确动作时先寻求指导。|손상 밴드·목 감기·얼굴 방향 신장 금지, 동작이 불명확하면 지도 요청.|Do not use damaged bands, wrap around neck or stretch toward the face; get guidance for an unfamiliar movement.']
];

const equipmentParts=Object.fromEntries(equipmentPartRows.map(([id,text])=>[id,text.split('|')]));
const equipmentGuideUI={open:T('查看使用方法','사용 방법 보기','View usage instructions'),close:T('收起使用方法','사용 방법 접기','Hide usage instructions'),demo:T('查看动作演示','동작 시연 보기','View movement demo'),choose:T('选择动作演示','동작 시연 선택','Choose a movement demo'),adjust:T('器械调节','기구 조절','Adjust equipment'),start:T('起始姿势','시작 자세','Starting position'),operate:T('操作步骤','동작 단계','Operating steps'),finish:T('结束与退出','종료 및 나오기','Finish and exit'),safety:T('基本安全注意事项','기본 안전 주의사항','Safety essentials'),missing:T('暂时没有适配此器械的可播放动作演示；请查看下方完整使用步骤。','이 기구에 맞는 재생 가능한 시연이 아직 없습니다. 아래 전체 사용 단계를 확인하세요.','No playable demonstration matching this equipment is available yet. Use the complete instructions below.'),variant:T('现有动画的器械或姿势变式不适配，未提供错误跳转。','기존 시연의 기구·자세 변형이 맞지 않아 잘못된 연결을 제공하지 않습니다.','The existing animation uses a different equipment or posture variant; no mismatched link is provided.'),readImage:T('结合上方插图辨认：','위 도해에서 확인: ','Identify in the illustration above: '),model:T('插图为通用结构示意。按钮、锁定方式和调节范围随机型变化，请以现场机身说明为准；不提供未经确认的型号专属设置。','그림은 일반 구조입니다. 버튼·잠금·조절 범위는 기종별로 다르므로 현장 안내를 따르세요. 확인되지 않은 모델별 설정은 제공하지 않습니다.','This is a general structure illustration. Controls, locks and adjustment ranges vary by model; follow the actual machine’s instructions. Unverified model-specific settings are not supplied.')};
let openedEquipmentGuides=new Set(),openedEquipmentChoices=new Set();
function availableEquipmentDemos(id){return (compatibleEquipmentDemos[id]||[]).filter(mid=>entity('move',mid)&&demoDefinitions[mid]&&entity('move',mid)[2].includes(id))}
function toggleEquipmentGuide(id){if(!entity('equipment',id))return;if(openedEquipmentGuides.has(id))openedEquipmentGuides.delete(id);else openedEquipmentGuides.add(id);renderEquipmentResults()}
function showEquipmentGuide(id){if(!entity('equipment',id))return;selected=id;openedEquipmentGuides.add(id);renderEquipmentResults();document.querySelector('#equipment-guide-'+id)?.scrollIntoView?.({behavior:'smooth',block:'nearest'})}
function toggleEquipmentDemoChoices(id){if(openedEquipmentChoices.has(id))openedEquipmentChoices.delete(id);else openedEquipmentChoices.add(id);renderEquipmentResults()}
function openEquipmentDemo(id,mid){if(!availableEquipmentDemos(id).includes(mid)){showEquipmentGuide(id);toast(equipmentGuideUI.missing);return}go('move',mid)}
function equipmentUsagePanel(id){const g=equipmentGuides[id],available=availableEquipmentDemos(id),isOpen=openedEquipmentGuides.has(id),choicesOpen=openedEquipmentChoices.has(id);if(!g)throw Error('Missing usage guide '+id);let related=moves.filter(m=>m[2].includes(id)),missing=related.filter(m=>!available.includes(m[0]));return `<section class="equipment-usage" data-equipment-usage="${id}"><div class="actions"><button type="button" class="primary" aria-expanded="${isOpen}" aria-controls="equipment-guide-${id}" onclick="toggleEquipmentGuide('${id}')">${tr(isOpen?equipmentGuideUI.close:equipmentGuideUI.open)}</button>${available.length===1?btn(equipmentGuideUI.demo,`openEquipmentDemo('${id}','${available[0]}')`):available.length>1?`<button type="button" aria-expanded="${choicesOpen}" aria-controls="equipment-demo-choices-${id}" onclick="toggleEquipmentDemoChoices('${id}')">${tr(equipmentGuideUI.demo)} ▾</button>`:''}</div>${available.length>1?`<div id="equipment-demo-choices-${id}" class="equipment-demo-choices" ${choicesOpen?'':'hidden'}><h4>${tr(equipmentGuideUI.choose)}</h4>${available.map(mid=>btn(entity('move',mid)[1],`openEquipmentDemo('${id}','${mid}')`,'chip')).join('')}</div>`:''}${!available.length?`<p class="guide-unavailable">${tr(equipmentGuideUI.missing)}</p>`:''}<div id="equipment-guide-${id}" class="equipment-guide-steps" ${isOpen?'':'hidden'}><h3>${tr(equipmentGuideUI.open)} · ${tr(nameFor('equipment',id))}</h3><p class="guide-image-reference">${tr(equipmentGuideUI.readImage)}${tr(equipmentParts[id])}</p><p class="muted">${tr(equipmentGuideUI.model)}</p><ol>${['adjust','start','operate','finish','safety'].map((key,i)=>`<li><span class="eyebrow">0${i+1}</span><h4>${tr(equipmentGuideUI[key])}</h4><p>${tr(g[key])}</p></li>`).join('')}</ol>${available.length?`<h4>${tr(equipmentGuideUI.choose)}</h4><div class="actions">${available.map(mid=>btn(tr(entity('move',mid)[1])+' ↗',`openEquipmentDemo('${id}','${mid}')`)).join('')}</div>`:''}${missing.length?`<div class="guide-variant-status"><h4>${tr(T('其他相关动作的演示状态','다른 관련 동작의 시연 상태','Other related demonstration availability'))}</h4>${missing.map(m=>`<p><strong>${tr(m[1])}</strong> — ${tr(unsupportedDemos[m[0]]||equipmentGuideUI.variant)}</p>`).join('')}</div>`:''}</div></section>`}
const equipmentResultsBeforeGuides=equipmentResults;
equipmentResults=function(arr){let html=equipmentResultsBeforeGuides(arr);if(!arr.length)return html;let a=arr.find(e=>e[0]===selected)||arr[0],id=a[0];html=html.replace('</figure>','</figure>'+equipmentUsagePanel(id));
// Existing related-action links also obey the exact animation/equipment compatibility rules.
for(const m of moves.filter(m=>m[2].includes(id))){let original=`onclick="go('move','${m[0]}')"`;let action=availableEquipmentDemos(id).includes(m[0])?`openEquipmentDemo('${id}','${m[0]}')`:`showEquipmentGuide('${id}')`;html=html.split(original).join(`onclick="${action}"`)}return html};
render();

</script>
<script>

const sportExperience={};
const sportExperienceRows=[
['climb','低位攀爬与重心转移|낮은 벽 오르기와 체중 이동|Low-wall climbing & weight transfer',
['观察支点，先站稳|홀드를 보고 안정시키기|Find holds and stabilize','在场馆入门指导下开始低位练习；先找到手点与脚点，确认安全区域。|시설 입문 지도로 낮은 위치에서 시작; 손·발 홀드와 안전 구역을 확인.|Start low with facility instruction; identify hand/foot holds and a clear safety area.'],
['脚先到位，移动重心|발 배치 후 체중 이동|Place a foot, then shift weight','以脚踩点支撑，移动一只脚时其余手脚保持接触；把重心移向稳定脚点。|발로 지지하고 한 발 이동 시 나머지 접촉 유지; 안정된 발 쪽으로 체중 이동.|Support through feet, keep other contacts while moving one foot, and shift weight toward a stable foothold.'],
['稳住身体再换手|몸을 안정시킨 뒤 손 이동|Stabilize, then move a hand','腿部支撑身体，保持稳定后移动一只手，再重新确认支点。示意不教授绳索保护。|다리로 지지하고 안정된 후 한 손 이동, 홀드 재확인. 로프 확보 교육은 포함하지 않음.|Use legs for support, stabilize before moving one hand, then recheck holds. This does not teach rope protection.'],
['沿指导路线结束|안내된 경로로 마무리|Finish by the instructed route','按场馆要求下攀或落地；不进入他人坠落区，不从高处自行跳下。|시설 안내대로 내려오거나 착지; 다른 사람 추락 구역과 높은 곳 임의 점프 금지.|Follow facility downclimbing/landing instructions; avoid others’ fall zones and unsupervised jumps from height.'],
'移动一只脚时，哪种做法更合适？|한 발을 옮길 때 더 적절한 행동은?|When moving one foot, which approach is better?',
['其余支点保持接触，脚踩稳后再移动身体|다른 접촉을 유지하고 발을 안정시킨 뒤 몸 이동|Keep other contacts and stabilize the foot before moving the body','手脚同时全部离开岩点|손발을 동시에 모두 홀드에서 떼기|Release all hand and foot holds together'],0,
'先稳住支点再转移重心，减少失去平衡；具体路线和保护方式按场馆指导。|홀드를 안정시킨 뒤 체중을 옮겨 균형 상실을 줄이세요. 경로·확보는 시설 지침을 따릅니다.|Stabilize contacts before shifting weight to reduce loss of balance; follow facility guidance for the route and protection.'],
['hike','上坡与下坡步行|오르막·내리막 걷기|Uphill & downhill walking',
['确认路线和落脚点|코스와 발 디딜 곳 확인|Check route and footing','选择能力范围内的路线，查看地面与天气，步幅以能稳稳落脚为准。|능력에 맞는 코스·노면·날씨를 확인하고 안정적으로 디딜 보폭 선택.|Choose a suitable route, check surface and weather, and use a stride that allows stable footing.'],
['上坡：短步稳走|오르막: 짧고 안정되게|Uphill: short, steady steps','保持躯干自然，随坡度适度前倾，不弯腰塌背；用较短步幅平稳上行。|몸통을 자연스럽게 유지하고 경사에 맞게 조금 기울이되 등을 구부리지 않고 짧게 걷기.|Keep a natural trunk, lean modestly with the slope without collapsing the back, and take steady shorter steps.'],
['下坡：控速软膝|내리막: 속도·무릎 조절|Downhill: control speed, soften knees','缩短步幅，膝保持可控弯曲，脚放稳后再转移重心，避免奔跑冲下。|보폭을 줄이고 무릎을 조절해 굽히며 발을 놓은 뒤 체중 이동, 뛰어 내려가지 않기.|Shorten steps, keep knees softly controlled, place the foot before shifting weight and avoid rushing down.'],
'下坡时应选择哪种做法？|내리막에서 더 적절한 방법은?|Which approach is safer downhill?',
['步幅越大越快越好|가능한 크고 빠른 보폭|Take the largest, fastest strides','缩短步幅，控制速度并注意落脚点|보폭을 줄이고 속도·발 디딜 곳 확인|Use shorter steps, control speed and watch footing'],1,
'下坡优先保持控制；膝不要僵硬锁死，遇湿滑、陡峭路段应降低速度或调整路线。|내리막은 조절이 우선입니다. 무릎을 잠그지 말고 미끄럽거나 가파르면 감속·경로 조정.|Prioritize control downhill; avoid rigidly locked knees and slow or change route on slippery or steep sections.'],
['swim','自由泳：交替划臂与打腿|자유형: 교대 팔 젓기와 발차기|Front crawl: alternating arms & flutter kick',
['身体伸展，先熟悉呼吸|몸을 길게, 호흡 익히기|Lengthen the body and learn breathing','在有救生员和教学指导的泳池练习，先掌握水中呼气、侧向换气与漂浮。|안전요원과 지도가 있는 수영장에서 물속 날숨·옆 호흡·뜨기부터 배우기.|Use a lifeguarded, instructed pool; first learn underwater exhalation, side breathing and floating.'],
['从髋部交替小幅打腿|고관절에서 작게 교대 킥|Small alternating kicks from the hips','身体接近水平，腿部伸展但不僵硬，从髋部带动交替打腿，避免大幅屈膝蹬水。|몸을 수평에 가깝게, 다리를 뻣뻣하지 않게 펴고 고관절 중심의 작은 교대 킥; 큰 무릎 굽힘 피하기.|Stay nearly horizontal with relaxed extended legs; kick alternately from the hips rather than using large knee bends.'],
['交替入水、划水和移臂|입수·당기기·리커버리 교대|Alternate entry, pull and recovery','一臂向前入水并向后划，另一臂在水面上移回前方，配合连续打腿。侧面图只展示肢体节奏，不完整表现身体滚转与换气。|한 팔이 앞으로 입수해 뒤로 젓는 동안 다른 팔은 수면 위로 돌아오며 킥 지속. 측면도는 리듬만 보이고 롤링·호흡 전체는 표현하지 않음.|One arm enters forward and pulls back as the other recovers above water, with continuous kicks. The side view shows limb rhythm, not complete body roll or breathing.'],
['轻松结束，扶稳池边|편안히 종료, 벽 지지|Finish gently at the wall','疲劳或呼吸紊乱时停止练习，在安全水域扶稳；不独自到深水区尝试。|피로·호흡 불안정 시 멈추고 안전 구역에서 지지, 혼자 깊은 물에서 시도 금지.|Stop with fatigue or disrupted breathing and use support in a safe area; do not try alone in deep water.'],
'初学自由泳时，哪种打腿方式更合适？|자유형 초보에게 적절한 킥은?|Which kick is appropriate for a beginner front crawl?',
['从髋部带动，小幅交替打腿|고관절 중심의 작은 교대 킥|Small alternating kicks initiated from the hips','不断大幅收膝，像骑车一样蹬水|무릎을 크게 접어 자전거처럼 차기|Repeated large knee bends like cycling'],0,
'自由泳打腿由髋部带动，膝保持自然柔软；具体呼吸和协调需要水中指导。|킥은 고관절에서 시작하고 무릎은 자연스럽게 부드럽게 유지합니다. 호흡·협응은 수중 지도가 필요합니다.|Initiate kicks from the hips with naturally soft knees; breathing and coordination need in-water instruction.'],
['cycle','坐姿骑行与踩踏|앉은 사이클 자세·페달링|Seated riding & pedaling',
['检查车辆与座位|자전거·안장 확인|Check bicycle and seat','检查刹车、轮胎和头盔；座高应让踏板最远处膝仍微屈，先在安全区域练习。|브레이크·타이어·헬멧 확인, 먼 페달에서 무릎 약간 굽힘, 안전 구역에서 시작.|Check brakes, tires and helmet; set seat for a soft knee at full reach and start in a safe area.'],
['放松上身，握稳车把|상체 편안히, 핸들 잡기|Relax the upper body, hold the bars','背部自然，肘略屈，双手轻握，目视前方，不把全身重量压在手腕上。|등 자연스럽게, 팔꿈치 약간 굽힘, 가볍게 잡고 전방 보기; 손목에 체중 전부 싣지 않기.|Use a natural back, soft elbows, light grip and forward gaze without loading all weight onto wrists.'],
['连续踩踏并安全停止|연속 페달링·안전 정지|Pedal smoothly and stop safely','保持髋部稳定、双腿连续踩踏；停止时提前减速，按车辆制动方式平稳停车。|골반을 안정시키고 연속 페달링; 미리 감속해 차량 제동법대로 정지.|Keep hips steady and pedal continuously; slow early and brake smoothly as appropriate to the bicycle.'],
'骑行前发现刹车异常，应该怎么做？|주행 전 브레이크 이상을 발견하면?|What should you do if brakes seem faulty before riding?',
['先骑快一点测试|빠르게 달려 시험|Test them by riding fast','先修复确认正常，再开始骑行|먼저 수리·정상 확인 후 주행|Repair and confirm proper function before riding'],1,
'刹车属于基本安全检查。先处理异常，再在安全环境中练习，不带故障上路。|브레이크는 기본 안전 점검입니다. 이상을 해결한 뒤 안전한 곳에서 연습하세요.|Brakes are a basic safety check. Resolve faults before practicing in a safe setting or riding on roads.'],
['run','轻松跑姿与摆臂|가벼운 달리기 자세·팔 스윙|Easy running posture & arm swing',
['从步行热身开始|걷기 준비부터|Begin with a walking warm-up','选平坦路线，穿合脚跑鞋，先步行，再以能控制的速度轻松慢跑。|평탄한 코스·맞는 러닝화, 걷기 후 조절 가능한 가벼운 조깅.|Choose level ground and suitable shoes, walk first, then jog at a controllable easy pace.'],
['躯干自然，步伐轻松|몸통 자연스럽게, 편한 보폭|Natural trunk and comfortable stride','目视前方，肩颈放松，避免刻意向前跨过大步或强迫固定落地方式。|전방 시선·어깨 이완, 과도한 앞걸음이나 특정 착지 강요 피하기.|Look forward and relax shoulders; avoid overstriding or forcing a particular foot strike.'],
['双臂自然前后摆动|팔을 자연스럽게 앞뒤로|Let arms swing naturally','肘自然弯曲，手放松，双臂随腿交替前后摆动，避免大幅横甩；结束时逐渐减速步行。|팔꿈치 자연 굽힘·손 이완, 다리와 교대로 앞뒤 스윙, 큰 가로 흔들기 피하고 종료 시 걷기로 감속.|Use relaxed bent elbows and hands, alternating forward/back arm swings; avoid large cross-body swings and finish by slowing to a walk.'],
'跑步时出现明显疼痛，应该怎么做？|달리다 뚜렷한 통증이 생기면?|What should you do with clear pain while running?',
['停止或减缓，评估情况再决定是否继续|멈추거나 줄이고 상태 확인 후 판단|Stop or ease off and assess before deciding to continue','加快速度坚持跑完|속도를 올려 끝까지 계속|Speed up and push through'],0,
'不通过疼痛强行完成。先停止或减缓，持续或严重不适应寻求适当帮助。|통증을 참고 완주하지 마세요. 멈추거나 줄이고 지속·심한 불편은 적절한 도움을 받으세요.|Do not force completion through pain. Stop or ease off and seek suitable help for persistent or severe discomfort.'],
['badminton','正手基础握拍与下手挥拍|포핸드 기본 그립·언더핸드 스윙|Basic forehand grip & underarm swing',
['轻握球拍，留出空间|가볍게 잡고 공간 확보|Hold lightly and clear space','以握手式基础正手握拍入门，拇指和食指形成V形，不把拍柄攥死。先确认周围无人。|악수하듯 기본 포핸드 그립, 엄지·검지 V, 꽉 쥐지 말고 주변 확인.|Begin with a handshake-style forehand grip, thumb and index forming a V; do not squeeze tightly and clear the area.'],
['侧前方准备|앞옆에서 준비|Prepare in front and to the side','膝微屈，持拍手在身体侧前方，拍头位于手下方；这是低位下手练习，不是头顶扣杀。|무릎을 살짝 굽히고 라켓을 앞옆에, 헤드는 손 아래; 낮은 언더핸드 연습이며 오버헤드 스매시 아님.|Use soft knees with racket hand slightly forward/to the side and head below hand; this is an underarm drill, not an overhead smash.'],
['向前上方挥拍并回位|앞위로 스윙 후 복귀|Swing forward/up and recover','以可控小幅动作向前上方挥拍，顺势随挥再回准备位，初学先无球慢练。|작고 조절된 앞위 스윙·팔로스루 후 준비 복귀, 처음에는 셔틀 없이 천천히.|Swing forward/up through a small controlled arc, follow through and recover; begin slowly without a shuttle.'],
'基础握拍时应该如何用力？|기본 그립의 힘은 어떻게?|How tightly should you hold the racket initially?',
['始终用尽全力攥紧|항상 최대 힘으로 꽉 쥐기|Squeeze as hard as possible throughout','以放松、可控制拍面的握持为主|편안하고 라켓 면을 조절할 수 있게 잡기|Hold relaxed enough to control the racket face'],1,
'先建立放松、可调整的握拍，避免持续僵硬用力；击球技术按课程逐步学习。|편안하고 조절 가능한 그립부터 익히고 계속 뻣뻣하게 쥐지 마세요. 타구 기술은 단계적으로 배우세요.|Develop a relaxed, adjustable grip rather than constant tension; learn stroke details progressively with instruction.'],
['tennis','基础正手：准备、击球、随挥|기본 포핸드: 준비·타구·팔로스루|Basic forehand: prepare, contact & follow-through',
['站稳并转肩准备|안정적으로 서서 어깨 회전|Establish stance and turn to prepare','双脚站稳、膝柔软，握拍方法先请教练确认；身体与肩一起转向持拍侧准备。|발·무릎 안정, 그립은 코치 확인; 몸통·어깨를 함께 라켓 쪽으로 돌려 준비.|Stand steadily with soft knees, get grip guidance, and turn torso/shoulders together toward the racket side.'],
['身体前方击球|몸 앞에서 타구|Contact in front of the body','用可控幅度从后向前挥拍，在身体前侧的舒适位置接触来球，不猛甩手腕。|조절된 뒤-앞 스윙으로 몸 앞의 편안한 지점에서 타구, 손목을 세게 꺾지 않기.|Swing forward with a manageable range and contact comfortably in front; avoid whipping the wrist.'],
['随挥后回到准备位|팔로스루 후 준비 복귀|Follow through and reset','让球拍自然随挥至身体另一侧，再回到平衡准备位。示意仅显示基本正手路径，不是完整三维技术教学。|라켓을 반대쪽으로 자연스럽게 보내고 균형 준비로 복귀. 기본 경로 도식이며 전체 3D 기술 교육은 아님.|Let the racket follow through across the body, then reset in balance. This shows the basic path, not complete three-dimensional technique.'],
'初学正手时，哪种目标更合适？|초보 포핸드의 적절한 목표는?|Which goal suits an early forehand lesson?',
['先控制击球与平衡，不追求最大力量|최대 힘보다 타구·균형 조절|Prioritize control and balance over maximum power','每次都用最大力量甩腕击球|매번 최대 힘으로 손목 휘두르기|Whip the wrist at maximum force every time'],0,
'先让动作与球路可控，再逐步提升速度和力量；击球前后保持平衡。|동작·공 경로를 조절한 뒤 속도·힘을 늘리고 전후 균형을 유지하세요.|Establish a controlled motion and ball path before increasing speed or power, maintaining balance before and after contact.'],
['yoga','山式：站立对齐与自然呼吸|타다아사나: 선 자세 정렬·호흡|Mountain pose: standing alignment & breathing',
['双脚稳定站立|두 발 안정시키기|Stand on stable feet','在防滑垫上双脚平稳承重，站距以舒适为准，膝不锁死。|미끄럼 방지 매트에서 편한 간격으로 두 발 지지, 무릎 잠금 피하기.|Stand evenly on a non-slip mat at a comfortable width with knees unlocked.'],
['拉长躯干，放松肩部|몸통 길게, 어깨 이완|Lengthen the trunk, relax shoulders','头部与躯干自然对齐，胸廓与骨盆保持自然位置，手臂放在体侧。|머리·몸통 자연 정렬, 흉곽·골반 자연 위치, 팔은 옆으로.|Align head and trunk naturally, keep ribs/pelvis comfortable and arms at sides.'],
['自然呼吸并平稳退出|자연 호흡 후 안정되게 종료|Breathe naturally and finish steadily','保持舒适站姿并自然呼吸，不屏气、不强拉；结束时缓慢改变姿势。山式是静态体式，动画只强调进入与保持。|편하게 서서 호흡, 숨 참기·강한 당김 없이 천천히 종료. 정적 자세이므로 진입·유지에 초점.|Maintain comfortable natural breathing without holding or forcing; exit slowly. This static pose demonstration emphasizes entering and holding.'],
'练习瑜伽时出现疼痛，应该？|요가 중 통증이 생기면?|What should you do if a yoga pose hurts?',
['继续用力拉到更深|더 강하게 깊이 늘리기|Force a deeper stretch','缓慢退出或调整体式，不强撑|천천히 풀거나 조절하고 억지로 버티지 않기|Ease out or adapt rather than forcing it'],1,
'尊重自己的活动范围。舒适呼吸与姿势控制优先，不以疼痛作为有效练习的标志。|자신의 가동 범위를 존중하고 호흡·조절을 우선하세요. 통증은 효과의 기준이 아닙니다.|Respect your range and prioritize comfortable breathing and control; pain is not a measure of effective practice.'],
['pilates','仰卧脚跟滑动：基础核心控制|누워 힐 슬라이드: 기초 코어 조절|Supine heel slide: basic core control',
['仰卧屈膝，找到稳定支撑|누워 무릎 굽혀 안정시키기|Lie with knees bent and steady support','仰卧垫上，双膝弯曲、脚掌着地，头肩放松，骨盆处于舒适位置。|매트에 누워 무릎을 굽히고 발을 대며 머리·어깨 이완, 골반 편안하게.|Lie on a mat with knees bent and feet down, relaxed head/shoulders and a comfortable pelvis.'],
['脚跟慢慢向前滑|뒤꿈치를 천천히 앞으로|Slide one heel forward slowly','自然呼吸，腹部轻度参与，一侧脚跟沿地面向前滑，只到骨盆和腰部仍能稳定的位置。|자연 호흡·가벼운 복부 참여, 한 뒤꿈치를 바닥으로 밀되 골반·허리 안정 범위만.|Breathe naturally with gentle abdominal control; slide one heel along the floor only while pelvis and lower back stay controlled.'],
['控制滑回，不屏气|조절해 돌아오고 숨 참지 않기|Slide back with control, keep breathing','将脚跟滑回屈膝位，保持躯干安静，再按能力换侧；若腰部明显改变或不适，缩小范围或停止。|뒤꿈치를 굽힌 자세로 되돌리고 몸통 안정 후 능력에 맞게 반대쪽; 허리 변화·불편 시 범위 축소·중단.|Slide heel back to bent-knee start, keep torso quiet and change sides if appropriate; reduce range or stop with back movement or discomfort.'],
'脚跟滑动时，哪种表现更合适？|힐 슬라이드의 적절한 모습은?|Which is the aim of a heel slide?',
['躯干和骨盆保持控制，同时自然呼吸|몸통·골반 조절과 자연 호흡|Controlled trunk/pelvis with natural breathing','尽量伸远，即使腰部明显拱起也不停止|허리가 크게 떠도 최대한 멀리 밀기|Reach as far as possible even if the back arches'],0,
'动作范围服从控制。脚跟滑动是基础核心练习，不以腿伸得最远为目标。|가동 범위보다 조절이 우선입니다. 기초 코어 연습이며 최대 거리 목표가 아닙니다.|Range follows control. This is basic core practice, not a contest to extend the leg farthest.'],
['boxing','基本防守站姿与前手直拳|기본 가드·리드 잽|Basic guard & lead straight punch',
['错步站稳，双手防守|엇갈려 서서 양손 가드|Stagger stance and establish guard','以左脚在前的示例错步站立，膝柔软、下巴微收，双拳靠近脸侧；左右可按指导调整。|왼발 앞 예시로 엇갈려 서고 무릎 부드럽게, 턱 살짝 당겨 양손 얼굴 옆; 지도로 반대쪽 가능.|Example: left foot forward, soft knees, chin gently tucked and fists near face; reverse stance with guidance if appropriate.'],
['前手直线伸出，后手守住|앞손 직선, 뒷손 가드|Extend lead hand, retain rear guard','前手沿直线向前伸，手腕与前臂保持对齐，后手留在脸侧，身体不过度前扑。|앞손을 직선으로 펴며 손목·전완 정렬, 뒷손은 얼굴 옆, 과한 전방 쏠림 피하기.|Extend the lead hand on a straight path with wrist/forearm aligned, rear hand guarding and no excessive forward lunge.'],
['及时收回防守位|바로 가드로 복귀|Return promptly to guard','前手沿原路收回，保持平衡与呼吸。示意为慢速非接触空击，不用于对打或击打硬物。|원래 경로로 앞손을 회수해 균형·호흡 유지. 느린 비접촉 섀도 동작이며 스파링·단단한 물체 타격용 아님.|Retract along the same path to guard, maintaining balance and breathing. This is slow, non-contact shadowboxing, not sparring or striking hard objects.'],
'伸出前手直拳时，后手应该？|리드 잽을 뻗을 때 뒷손은?|What should the rear hand do during a lead straight?',
['垂在身后|뒤로 늘어뜨리기|Drop behind the body','留在脸侧保持防守|얼굴 옆 가드 유지|Stay near the face in guard'],1,
'前手出拳时后手继续防守，出拳手及时收回；初学应先接受站姿与手腕对齐指导。|앞손 펀치 중 뒷손 가드, 펀치 손은 바로 회수. 초보자는 자세·손목 정렬 지도를 먼저 받으세요.|Keep rear-hand guard and recover the lead hand; beginners should receive stance and wrist-alignment instruction first.']

state.sportInteractions=state.sportInteractions||{};
