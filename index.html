const sportPlayerStates={};
let sportPlayerFrame=null;
function sportPlayer(id){if(!sportPlayerStates[id])sportPlayerStates[id]={open:false,playing:false,time:0,last:null};return sportPlayerStates[id]}
function validSport(id){return sports.some(s=>s[0]===id)&&!!sportExperience[id]}
function sportFrameTime(id){return (sportPlayer(id).time%9000)/9000}
function toggleSportDemo(id){if(!validSport(id))return;let player=sportPlayer(id);player.open=!player.open;if(player.open)player.playing=true;player.last=null;render()}
function sportDemoControl(id,action){if(!validSport(id))return;let player=sportPlayer(id);if(action==='toggle')player.playing=!player.playing;if(action==='restart'){player.time=0;player.playing=true}player.last=null;render()}
function updateSportPlayer(time){if(page!=='sport'||!selected||!validSport(selected))return;const id=selected,player=sportPlayer(id);let frame=document.querySelector('#sport-motion-frame');if(!player.open||!frame)return;if(player.last!==null&&player.playing)player.time+=Math.max(0,Math.min(100,time-player.last));player.last=time;frame.innerHTML=sportScene(id,sportFrameTime(id));sportPlayerFrame=requestAnimationFrame(updateSportPlayer)}
function sportTutorialIndex(id){return Math.max(0,Math.min(sportExperience[id].steps.length-1,Number(state.sportTutorialSteps[id])||0))}
function sportTutorialMove(id,delta){if(!validSport(id))return;state.sportTutorialSteps[id]=Math.max(0,Math.min(sportExperience[id].steps.length-1,sportTutorialIndex(id)+delta));persist();render()}
function sportQuizAnswer(id,choice){if(!validSport(id))return;const q=sportExperience[id].quiz;if(!Number.isInteger(choice)||choice<0||choice>=q.options.length)return;const previous=state.sportInteractions[id]||{};state.sportInteractions[id]={choice,correct:choice===q.correct,completed:previous.completed||choice===q.correct,date:choice===q.correct?(previous.date||now()):previous.date||null};persist();render()}
function claimSportExperience(id){if(!validSport(id))return;const qid=id==='climb'?'q8':id==='hike'?'q10':'q9';claim(qid);showTasks('sport',id)}
const sportReferences={climb:['https://www.thebmc.co.uk/en/five-steps-to-start-climbing-indoor-outdoor-beginner','BMC'],hike:['https://www.nps.gov/subjects/trails/hiking-safety.htm','NPS'],swim:['https://www.swimming.org/masters/improving-front-crawl-technique/','Swim England'],cycle:['https://www.nhs.uk/live-well/exercise/','NHS'],run:['https://www.nhs.uk/live-well/exercise/','NHS'],badminton:['https://www.badminton.org.au/wp-content/uploads/2022/11/1.-BWF-ST-Teachers-Manual_Inclusivity_ENGLISH.pdf','BWF Shuttle Time'],tennis:['https://www.usta.com/en/home/improve/tips-and-instruction/national/learning-the-basics--forehand.html','USTA'],yoga:['https://www.nhs.uk/live-well/exercise/pilates-and-yoga/','NHS'],pilates:['https://www.nhs.uk/live-well/exercise/pilates-and-yoga/','NHS'],boxing:['https://boxingcanada.org/wp-content/uploads/2025/01/Instruction-Beginners-Reference-Manual-EN.pdf','Boxing Canada']};
function sportInteractionPanel(id){let ex=sportExperience[id],index=sportTutorialIndex(id),step=ex.steps[index],player=sportPlayer(id),result=state.sportInteractions[id],q=ex.quiz;const phases={climb:[0,.15,.35,.49],hike:[0,.25,.5],swim:[0,.25,.5,.75],cycle:[0,.25,.5],run:[0,.25,.5],badminton:[0,.2,.5],tennis:[0,.26,.53],yoga:[0,.2,.6],pilates:[0,.5,.85],boxing:[0,.3,.8]};return `<section class="sport-experience" data-sport-experience="${id}"><div class="actions"><button type="button" class="primary" aria-expanded="${player.open}" aria-controls="sport-demo-${id}" onclick="toggleSportDemo('${id}')">${tr(player.open?sportLabels.hide:sportLabels.watch)}</button></div><div id="sport-demo-${id}" class="sport-demo" ${player.open?'':'hidden'}><h3>${tr(ex.demo)}</h3>${player.open?`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" role="img" aria-label="${tr(ex.demo)}"><title>${tr(ex.demo)}</title><g id="sport-motion-frame">${sportScene(id,sportFrameTime(id))}</g></svg>`:''}<div class="actions"><button type="button" aria-pressed="${player.playing}" onclick="sportDemoControl('${id}','toggle')">${tr(player.playing?sportLabels.pause:sportLabels.play)}</button>${btn(sportLabels.restart,`sportDemoControl('${id}','restart')`)}</div><ol class="sport-demo-notes">${ex.steps.map(s=>`<li><strong>${tr(s.name)}</strong> · ${tr(s.text)}</li>`).join('')}</ol><p class="sport-disclaimer">${tr(sportLabels.caption)}</p></div><section class="sport-walkthrough"><span class="eyebrow">${tr(sportLabels.intro)}</span><h3>${tr(ex.demo)}</h3><div class="sport-step-grid"><div class="sport-step-picture">${sportSceneSVG(id,phases[id][index],'step')}</div><div><span class="tag">${tr(sportLabels.step)} ${index+1} / ${ex.steps.length}</span><h4>${tr(step.name)}</h4><p>${tr(step.text)}</p><div class="actions"><button type="button" onclick="sportTutorialMove('${id}',-1)" ${index===0?'disabled':''}>${tr(sportLabels.prev)}</button><button type="button" onclick="sportTutorialMove('${id}',1)" ${index===ex.steps.length-1?'disabled':''}>${tr(sportLabels.next)}</button></div></div></div></section><section class="sport-quiz"><span class="eyebrow">${tr(sportLabels.quiz)}</span><h3>${tr(q.question)}</h3>${q.options.map((o,i)=>`<button type="button" class="answer ${result?.choice===i?'quiz-picked':''}" aria-pressed="${result?.choice===i}" onclick="sportQuizAnswer('${id}',${i})">${tr(o)}</button>`).join('')}${result?`<div class="sport-feedback" role="status"><strong>${tr(result.correct?sportLabels.right:sportLabels.wrong)}</strong><p>${tr(sportLabels.answer)}：${tr(q.options[q.correct])}</p><p>${tr(q.feedback)}</p>${result.completed?`<span class="tag">✓ ${tr(T('互动学习已完成','인터랙티브 학습 완료','Learning interaction completed'))}</span>`:''}</div>`:''}</section><details class="content-reference"><summary>${tr(V.source)}</summary>${reference(sportReferences[id][0],sportReferences[id][1])}<p>${tr(sportLabels.caption)}</p></details></section>`}
const sportsPageBeforeInteraction=sportsPage;
sportsPage=function(){let html=sportsPageBeforeInteraction();if(!selected){for(const s of sports)html=html.replace(`<span class="sport-illustration">${s[1]}</span>`,`<span class="sport-scene-thumb">${sportSceneSVG(s[0],.16)}</span>`);return html}const id=selected;if(!validSport(id))return html;let s=entity('sport',id);html=html.replace(`<span class="sport-illustration">${s[1]}</span>`,`<figure class="sport-scene-hero">${sportSceneSVG(id,.16)}<figcaption>${tr(sportLabels.image)} · ${tr(sportExperience[id].demo)}</figcaption></figure>`);html=html.replace(`<h4>${tr(V.features)}</h4>`,sportInteractionPanel(id)+`<h4>${tr(V.features)}</h4>`);let qid=id==='climb'?'q8':id==='hike'?'q10':'q9';let oldTask=btn(ui.claim,`claim('${qid}');showTasks('sport','${id}')`,'primary');let task=btn(sportLabels.task,`claimSportExperience('${id}')`,'primary');if(qid==='q9')task+=`<p class="muted">${tr(sportLabels.general)}</p>`;return html.replace(oldTask,task)};
const renderBeforeSportsInteraction=render;
render=function(){cancelAnimationFrame(sportPlayerFrame);for(const player of Object.values(sportPlayerStates))player.last=null;renderBeforeSportsInteraction();if(page==='sport'&&validSport(selected)&&sportPlayer(selected).open)sportPlayerFrame=requestAnimationFrame(updateSportPlayer)};
render();

</script>
</body></html>
